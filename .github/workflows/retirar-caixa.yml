name: Retirar AppBetinhos

# Segunda janela da promoção (depois de "Publicar soluções" com as 4 no mesmo alvo): tira do TEST ou do PROD as soluções
# gerenciadas antigas, AppBetinhos e gerarpagantes, que as 4 substituem.
#  1. foto-dev (environment dev, só leitura): foto do DEV da mesma janela, prova do que saiu da AppBetinhos de propósito;
#  2. retirar (environment do alvo; no prod com revisor): foto antes; registros das tabelas aceitas exportados em JSON (elas só
#     existem na AppBetinhos e somem com ela; decisão registrada no input); conferir-retirada --dev (o que está só na caixa tem
#     de estar ausente do DEV; tabela com registros só se aceita); desinstalação das duas; foto depois e comparação --retirada
#     (o que era só da caixa e sumiu é informativo; queda de registros e qualquer outra perda reprovam).
# Não faz upgrade da AppBetinhos antes de desinstalar: no TEST (30/10/2026) ele caiu duas vezes com erro de transporte SQL do
# servidor aos 30-50 min; a desinstalação direta apaga o mesmo conjunto, e a barreira com a foto do DEV prova que é o esperado.
on:
  workflow_dispatch:
    inputs:
      alvo:
        description: 'Ambiente de destino'
        type: choice
        required: true
        default: test
        options: [test, prod]
      aceitarTabelas:
        description: 'Tabelas (nomes lógicos, vírgula) que podem sumir com a AppBetinhos; registros são exportados antes'
        required: false
        default: 'cr40f_contextooperacionalia'

concurrency:
  group: publicar-${{ inputs.alvo }}
  cancel-in-progress: false

env:
  ALVO_PS: ${{ inputs.alvo == 'prod' && 'Prod' || 'Test' }}
  TRAVADO: ${{ inputs.alvo == 'test' && '--travado' || '' }}
  ACEITAR: ${{ inputs.aceitarTabelas }}

jobs:
  foto-dev:
    runs-on: windows-latest
    timeout-minutes: 30
    environment: dev
    env:
      DV_ENVIRONMENT_URL: ${{ vars.DV_ENVIRONMENT_URL }}
      DV_TENANT_ID: ${{ vars.DV_TENANT_ID }}
      DV_CLIENT_ID: ${{ vars.DV_CLIENT_ID }}
      DV_CLIENT_SECRET: ${{ secrets.DV_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Foto do DEV (só leitura)
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File packages/deploy/solucoes/foto-ambiente.ps1 -EnvironmentUrl $env:DV_ENVIRONMENT_URL -Saida foto-dev/dev.json
      - uses: actions/upload-artifact@v4
        with:
          name: foto-dev
          path: foto-dev/
          retention-days: 90

  retirar:
    needs: foto-dev
    runs-on: windows-latest
    timeout-minutes: 240
    environment: ${{ inputs.alvo }}
    env:
      DV_ENVIRONMENT_URL: ${{ vars.DV_ENVIRONMENT_URL }}
      DV_TENANT_ID: ${{ vars.DV_TENANT_ID }}
      DV_CLIENT_ID: ${{ vars.DV_CLIENT_ID }}
      DV_CLIENT_SECRET: ${{ secrets.DV_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: foto-dev
          path: foto-dev
      - name: Instalar pac
        run: |
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool
          pac auth create --name ci-alvo --applicationId $env:DV_CLIENT_ID --clientSecret $env:DV_CLIENT_SECRET --tenant $env:DV_TENANT_ID --environment $env:DV_ENVIRONMENT_URL
      - name: Foto antes
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File packages/deploy/solucoes/foto-ambiente.ps1 -EnvironmentUrl $env:DV_ENVIRONMENT_URL -Saida fotos/antes.json
      - name: Exportar registros das tabelas aceitas
        if: inputs.aceitarTabelas != ''
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File packages/deploy/solucoes/exportar-registros.ps1 -EnvironmentUrl $env:DV_ENVIRONMENT_URL -Tabelas "$env:ACEITAR" -Pasta registros
      - name: Conferir retirada (com a foto do DEV) e desinstalar AppBetinhos e gerarpagantes
        run: |
          $extra = @(); if ($env:ACEITAR) { $extra += @('-AceitarTabelas', $env:ACEITAR) }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File packages/deploy/solucoes/retirar-caixa.ps1 -EnvironmentUrl $env:DV_ENVIRONMENT_URL -Alvo $env:ALVO_PS -Foto fotos/antes.json -FotoDev foto-dev/dev.json -Saida fotos/retirada.json @extra
      - name: Foto depois
        if: always()
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File packages/deploy/solucoes/foto-ambiente.ps1 -EnvironmentUrl $env:DV_ENVIRONMENT_URL -Saida fotos/depois.json
      - name: Comparar antes → depois
        if: always()
        shell: bash
        run: |
          set -o pipefail
          node packages/deploy/solucoes/comparar-fotos.mjs $TRAVADO --retirada --aceitar-tabelas "$ACEITAR" fotos/antes.json fotos/depois.json | tee fotos/comparacao.json
      - name: Resumo
        if: always()
        shell: bash
        run: |
          {
            echo "## Retirar AppBetinhos: ${{ inputs.alvo }}"
            echo "Retirada:"; echo '```json'; cat fotos/retirada.json 2>/dev/null || echo "não concluída"; echo '```'
            echo "Comparação no artefato \`retirada-${{ inputs.alvo }}\` (comparacao.json). Perda reprova a execução."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retirada-${{ inputs.alvo }}
          path: |
            fotos/
            registros/
            foto-dev/
          retention-days: 90

name: Deploy

# Só DEV: push na branch develop publica a tela do Sistema Betinhos no DEV (decisão do Renan, 05/11/2026: develop → DEV,
# main → PROD). TEST e PROD são do workflow Produção (producao.yml), disparado pela main.
# A descrição do HTML publicado guarda a versão e o commit (push-dev.ps1); o publicar.yml usa o commit para nunca levar ao
# PROD uma tela do DEV que ainda não entrou na main.
# Feito para gastar poucos minutos de CI (repo privado, runner Windows conta em dobro):
#  - só roda quando muda código do app; documentação, skills e scripts do plantão não disparam;
#  - não repete o CI (typecheck e testes já passaram no PR que entrou na develop);
#  - instala só o pacote do shell e suas dependências;
#  - limite de 15 min; um push novo espera o deploy em andamento (grupo dataverse-dev, o mesmo do export do publicar.yml,
#    para o DEV nunca mudar no meio de um export). Só um fica na fila: o mais novo, que já inclui os anteriores.
on:
  push:
    branches: [develop]
    paths:
      - 'apps/shell/**'
      - 'packages/dataverse/**'
      - 'packages/deploy/push-dev.ps1'
      - 'packages/deploy/bump-version.mjs'
      - 'packages/deploy/inline-webresource.mjs'
      - 'packages/deploy/loader.template.html'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

concurrency:
  group: dataverse-dev
  cancel-in-progress: false

jobs:
  # DEV é não gerenciado e é onde schema e flows são editados; aqui só a tela é publicada.
  dev:
    runs-on: windows-latest
    timeout-minutes: 15
    environment: dev
    env:
      DV_ENVIRONMENT_URL: ${{ vars.DV_ENVIRONMENT_URL }}
      DV_BLOCKED_HOSTS: ${{ vars.DV_BLOCKED_HOSTS }}
      DV_TENANT_ID: ${{ vars.DV_TENANT_ID }}
      DV_CLIENT_ID: ${{ vars.DV_CLIENT_ID }}
      DV_CLIENT_SECRET: ${{ secrets.DV_CLIENT_SECRET }}
      DV_SOLUTION: AppBetinhos
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          # @betinhos/ui vem do GitHub Packages (repo design-system-betinhos). O GITHUB_TOKEN lê porque cada pacote
          # (ui e tokens) lista este repo em Package settings → Manage Actions access (Read).
          registry-url: https://npm.pkg.github.com
          scope: '@betinhos-executive-service'
      - run: pnpm install --frozen-lockfile --filter @betinhos/shell...
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm push
      - name: Versão publicada
        shell: bash
        run: echo "Publicado no DEV - v$(node -p "require('./apps/shell/package.json').version")" >> "$GITHUB_STEP_SUMMARY"

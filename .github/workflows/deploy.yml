name: Deploy

# Só DEV: push na branch develop publica no DEV a tela do Sistema Betinhos, os plugins e os flows que mudaram, e distribui nas 4
# soluções (decisão do Renan, 05/11/2026: develop → DEV, main → PROD). TEST e PROD são do workflow Produção (producao.yml).
# O que publicar sai de pendentes-dev.ps1: compara o commit que o DEV registra em cada peça (descrição da tela e de cada
# assembly Cr40f.*.Plugin e Betinhos.DriverRecordSharing) com o HEAD. Assim um deploy cancelado na fila ou uma publicação local nunca deixa peça para trás,
# e o publicar.yml usa os mesmos registros para nunca levar ao PROD tela ou plugin que ainda não entrou na main.
# App Motoristas (apps/motoristas, desde a fase 2 da migração do app-motoristas-v2): o app e o service worker pendentes saem
# por apps/motoristas/scripts/push-front-dev.ps1, que só atualiza web resource que já existe (sem distribuição).
# Flows: cada packages/deploy/provision-flow-*.ps1 cujos arquivos mudaram desde a tag flows-dev-publicado (flows-dev.mjs) roda
# na conta de serviço (az login do service principal) e só atualiza flow que já existe no DEV (push-flows-dev.ps1). Flow novo,
# schema (provision-* sem flow) e sitemap:* continuam à mão: o flow novo nasce com dono na conta de serviço e não liga, e o
# resto usa az login e conexões do usuário. Se um flow falha, os outros seguem, a distribuição roda, o Deploy termina
# vermelho com as causas no resumo e a tag não anda (o próximo Deploy tenta de novo).
# Feito para gastar poucos minutos de CI (repo privado, runner Windows conta em dobro):
#  - só roda quando muda a tela, o Formulário Geral, um plugin ou os scripts deste deploy; documentação e skills não disparam;
#  - um job só (um setup de runner); cada passo pesado roda só se a sua peça está pendente;
#  - não repete o CI (typecheck e testes do shell e dos plugins já passaram no PR que entrou na develop);
#  - instala só os pacotes pendentes (shell, gerar-pagantes) e suas dependências; cache do pnpm e do NuGet;
#  - distribui uma vez só, no fim;
#  - um push novo espera o deploy em andamento (grupo dataverse-dev, o mesmo do export do publicar.yml, para o DEV nunca
#    mudar no meio de um export). Só um fica na fila: o mais novo, e ele publica tudo o que o DEV ainda não tem.
on:
  push:
    branches: [develop]
    paths:
      - 'apps/shell/**'
      - 'apps/gerar-pagantes/**'
      - '!apps/gerar-pagantes/**/*.test.*'
      - 'packages/deploy/push-webresources-dev.ps1'
      - 'apps/formulario-geral/**'
      - '!apps/formulario-geral/**/*.test.*'
      - '!apps/formulario-geral/**/*.fixtures.*'
      - '!apps/formulario-geral/**/*.md'
      - '!apps/formulario-geral/docs/**'
      - '!apps/formulario-geral/power-platform/**'
      - '!apps/formulario-geral/scripts/provision-*'
      - 'packages/deploy/push-formulario-dev.ps1'
      # App Motoristas (decisão de mudanças em mudancas-dev.mjs: teste, documentação e script que não entra no build não publicam).
      - 'apps/motoristas/**'
      - '!apps/motoristas/tests/**'
      - '!apps/motoristas/docs/**'
      - '!apps/motoristas/**/*.md'
      - '!apps/motoristas/.claude/**'
      - 'packages/dataverse/**'
      - 'pnpm-lock.yaml'
      - 'packages/deploy/push-dev.ps1'
      - 'packages/deploy/push-plugins-dev.ps1'
      - 'packages/deploy/pendentes-dev.ps1'
      - 'packages/deploy/push-flows-dev.ps1'
      - 'packages/deploy/flows-dev.mjs'
      - 'packages/deploy/provision-flow-*.ps1'
      - 'packages/deploy/flows/**'
      - '!packages/deploy/flows/**/*.test.mjs'
      - 'packages/agentes-ia/src/**'
      - '!packages/agentes-ia/src/**/*.test.ts'
      - 'packages/agentes-ia/scripts/gerar-constantes.ts'
      - 'packages/despesas-ia/src/**'
      - '!packages/despesas-ia/src/**/*.test.ts'
      - 'packages/despesas-ia/scripts/gerar-constantes.ts'
      - 'packages/deploy/mudancas-dev.mjs'
      - 'packages/deploy/caminho-publicacao.mjs'
      - 'packages/deploy/bump-version.mjs'
      - 'packages/deploy/inline-webresource.mjs'
      - 'packages/deploy/loader.template.html'
      - 'packages/plugins/Cr40f.*.Plugin/**'
      - 'packages/plugins/Betinhos.DriverRecordSharing/**'
      - 'packages/plugins/tools/**'
      - 'packages/plugins/scripts/**'
  workflow_dispatch:
    inputs:
      forcar_tela:
        description: 'Publicar a tela mesmo sem mudança'
        type: boolean
        default: false
      forcar_webresources:
        description: 'Publicar a Tela Gerar Pagantes e o gerador de recibo mesmo sem mudança'
        type: boolean
        default: false
      forcar_formulario:
        description: 'Publicar o Formulário Geral mesmo sem mudança'
        type: boolean
        default: false
      forcar_motoristas:
        description: 'App Motoristas a publicar mesmo sem mudança: app, sw ou app,sw; vazio = só o que está pendente'
        type: string
        default: ''
      forcar_plugins:
        description: 'Plugins a publicar mesmo sem mudança (frota,acesso,driverrecordsharing ou todos); vazio = só os pendentes'
        type: string
        default: ''
      forcar_flows:
        description: 'Flows a publicar mesmo sem mudança (nomes de flows-dev.mjs separados por vírgula, ou todos); vazio = só os pendentes'
        type: string
        default: ''

concurrency:
  group: dataverse-dev
  cancel-in-progress: false

jobs:
  dev:
    runs-on: windows-latest
    timeout-minutes: 30
    environment: dev
    env:
      DV_ENVIRONMENT_URL: ${{ vars.DV_ENVIRONMENT_URL }}
      DV_BLOCKED_HOSTS: ${{ vars.DV_BLOCKED_HOSTS }}
      DV_TENANT_ID: ${{ vars.DV_TENANT_ID }}
      DV_CLIENT_ID: ${{ vars.DV_CLIENT_ID }}
      DV_CLIENT_SECRET: ${{ secrets.DV_CLIENT_SECRET }}
      DV_SOLUTION: AppBetinhos
      # Argumentos dos provision-flow-*.ps1 (flows-dev.mjs): valores já gravados no DEV, lidos de variáveis do environment dev.
      FLOW_ANIVERSARIANTES_REMETENTE: ${{ vars.FLOW_ANIVERSARIANTES_REMETENTE }}
      FLOW_ANIVERSARIANTES_DESTINATARIOS: ${{ vars.FLOW_ANIVERSARIANTES_DESTINATARIOS }}
      FLOW_EMAIL_ADMIN_AVISOS: ${{ vars.FLOW_EMAIL_ADMIN_AVISOS }}
      FLOW_AVALIACAO_EMAIL_OPERACAO: ${{ vars.FLOW_AVALIACAO_EMAIL_OPERACAO }}
      FLOW_SHAREPOINT_SITE_URL: ${{ vars.FLOW_SHAREPOINT_SITE_URL }}
      FLOW_CADASTRO_BIBLIOTECA_ID: ${{ vars.FLOW_CADASTRO_BIBLIOTECA_ID }}
      FLOW_CADASTRO_PASTA: ${{ vars.FLOW_CADASTRO_PASTA }}
      FLOW_DOCUMENTOS_REMETENTE: ${{ vars.FLOW_DOCUMENTOS_REMETENTE }}
      FLOW_DOCUMENTOS_URL_SISTEMA: ${{ vars.FLOW_DOCUMENTOS_URL_SISTEMA }}
      FLOW_FROTA_REMETENTE: ${{ vars.FLOW_FROTA_REMETENTE }}
      FLOW_PORTAL_CAIXA_COMPARTILHADA: ${{ vars.FLOW_PORTAL_CAIXA_COMPARTILHADA }}
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: O que o DEV ainda não tem
        id: pendentes
        env:
          FORCAR_TELA: ${{ inputs.forcar_tela }}
          FORCAR_WEBRESOURCES: ${{ inputs.forcar_webresources }}
          FORCAR_FORMULARIO: ${{ inputs.forcar_formulario }}
          FORCAR_PLUGINS: ${{ inputs.forcar_plugins }}
          FORCAR_MOTORISTAS: ${{ inputs.forcar_motoristas }}
        run: |
          $saida = @(powershell.exe -NoProfile -ExecutionPolicy Bypass -File packages/deploy/pendentes-dev.ps1 -GitHub)
          if ($LASTEXITCODE -ne 0) { throw 'pendentes-dev.ps1 falhou.' }
          $tela = ($saida -contains 'tela=true') -or ($env:FORCAR_TELA -eq 'true')
          $webresources = ($saida -contains 'webresources=true') -or ($env:FORCAR_WEBRESOURCES -eq 'true')
          $formulario = ($saida -contains 'formulario=true') -or ($env:FORCAR_FORMULARIO -eq 'true')
          $plugins = (($saida | Where-Object { $_ -like 'plugins=*' }) -replace '^plugins=', '')
          # App Motoristas: peças app (HTML, precisa de build) e sw (cópia da fonte), na lista que push-front-dev.ps1 recebe.
          $motoristas = @()
          if ($saida -contains 'motoristas=true') { $motoristas += 'app' }
          if ($saida -contains 'motoristas_sw=true') { $motoristas += 'sw' }
          if ($env:FORCAR_MOTORISTAS) { $motoristas += @($env:FORCAR_MOTORISTAS.Split(',') | ForEach-Object { $_.Trim().ToLowerInvariant() } | Where-Object { $_ }) }
          $motoristas = (@($motoristas | Sort-Object -Unique) -join ',')
          if ($env:FORCAR_PLUGINS) { $plugins = (@($plugins.Split(',') + $env:FORCAR_PLUGINS.Split(',')) | ForEach-Object { $_.Trim().ToLowerInvariant() } | Where-Object { $_ } | Sort-Object -Unique) -join ',' }
          if (($env:FORCAR_PLUGINS -split ',' | ForEach-Object { $_.Trim() }) -contains 'todos') { $plugins = 'todos' }
          "tela=$($tela.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "webresources=$($webresources.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "formulario=$($formulario.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          $instalar = @(if ($tela) { '--filter @betinhos/shell...' }; if ($webresources) { '--filter @betinhos/gerar-pagantes...' }; if ($formulario) { '--filter @betinhos/formulario-geral...' }) -join ' '
          "instalar=$instalar" >> $env:GITHUB_OUTPUT
          # O Motoristas (React 18) instala depois da tela: junto com o shell (React 19), o @types/react 18 sobe e a tela não compila.
          "motoristas_app=$(($motoristas -split ',' -contains 'app').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "plugins=$plugins" >> $env:GITHUB_OUTPUT
          "motoristas=$motoristas" >> $env:GITHUB_OUTPUT
          Write-Host "tela: $tela; webresources: $webresources; formulario: $formulario; motoristas: $(if ($motoristas) { $motoristas } else { 'nada' }); plugins: $(if ($plugins) { $plugins } else { 'nenhum' })"

      # Flows. A base é a tag flows-dev-publicado (mesmo padrão da prod-publicado do producao.yml); sem tag nada fica pendente
      # e o job final cria a tag no HEAD. O diff compara só as árvores dos dois commits, então basta buscar a tag com depth=1.
      # Roda antes da tela e dos plugins: uma falha aqui não deixa peça publicada sem distribuir. Flow só sai da develop.
      - name: Quais flows publicar
        id: flowspend
        shell: bash
        env:
          FORCAR_FLOWS: ${{ inputs.forcar_flows }}
        run: |
          if [ "$GITHUB_REF" != 'refs/heads/develop' ]; then
            echo "::warning title=Flows no DEV::Fora da develop ($GITHUB_REF): nenhum flow publicado."
            exit 0
          fi
          if [ -n "$FORCAR_FLOWS" ]; then
            saida=$(node packages/deploy/flows-dev.mjs --forcar "$FORCAR_FLOWS" --github)
          else
            # 2 = a tag não existe; outro código é falha de rede e não pode virar "nada pendente".
            rc=0; git ls-remote --exit-code origin refs/tags/flows-dev-publicado > /dev/null || rc=$?
            if [ "$rc" -eq 0 ]; then
              git fetch --quiet --no-tags --depth=1 origin 'refs/tags/flows-dev-publicado:refs/tags/flows-dev-publicado'
              saida=$(git diff --name-only 'refs/tags/flows-dev-publicado^{commit}' HEAD | node packages/deploy/flows-dev.mjs --github)
            elif [ "$rc" -eq 2 ]; then
              echo "Tag flows-dev-publicado ausente: nada pendente; ela é criada no HEAD ao fim."
              saida=$(node packages/deploy/flows-dev.mjs --sem-base --github)
            else
              exit "$rc"
            fi
          fi
          echo "$saida" >> "$GITHUB_OUTPUT"
          echo "$saida"

      # Tela
      - if: steps.pendentes.outputs.instalar != '' || steps.pendentes.outputs.motoristas_app == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.pendentes.outputs.instalar != '' || steps.pendentes.outputs.motoristas_app == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          # @betinhos/ui vem do GitHub Packages (repo design-system-betinhos). O GITHUB_TOKEN lê porque cada pacote
          # (ui e tokens) lista este repo em Package settings → Manage Actions access (Read).
          registry-url: https://npm.pkg.github.com
          scope: '@betinhos-executive-service'
      - if: steps.pendentes.outputs.instalar != ''
        run: pnpm install --frozen-lockfile ${{ steps.pendentes.outputs.instalar }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar a tela
        if: steps.pendentes.outputs.tela == 'true'
        run: pnpm push
        env:
          BETINHOS_DISTRIBUIR: '0'

      # Tela Gerar Pagantes e gerador de recibo
      - name: Publicar os WebResources
        if: steps.pendentes.outputs.webresources == 'true'
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File packages/deploy/push-webresources-dev.ps1

      # Formulário Geral (o webresource.html nasce no build; schema, connector e flows da agenda IA continuam à mão)
      - name: Publicar o Formulário Geral
        if: steps.pendentes.outputs.formulario == 'true'
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File packages/deploy/push-formulario-dev.ps1

      # App Motoristas: só atualiza o web resource que já existe (não mexe em solução, então fica fora da distribuição).
      - if: steps.pendentes.outputs.motoristas_app == 'true'
        run: pnpm install --frozen-lockfile --filter '@betinhos/motoristas...'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar o App Motoristas
        id: motoristas
        if: steps.pendentes.outputs.motoristas != ''
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File apps/motoristas/scripts/push-front-dev.ps1 -Pecas "${{ steps.pendentes.outputs.motoristas }}"
          if ($LASTEXITCODE -ne 0) { throw 'push-front-dev.ps1 do App Motoristas falhou.' }

      # Plugins
      - if: steps.pendentes.outputs.plugins != ''
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('packages/plugins/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Publicar os plugins
        if: steps.pendentes.outputs.plugins != ''
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File packages/deploy/push-plugins-dev.ps1 -Plugins "${{ steps.pendentes.outputs.plugins }}"
        env:
          # Chaves de assinatura (base64 do .snk). Uma chave nova mudaria o public key token do assembly.
          PLUGIN_SNK_ACESSO: ${{ secrets.PLUGIN_SNK_ACESSO }}
          PLUGIN_SNK_CADASTRO: ${{ secrets.PLUGIN_SNK_CADASTRO }}
          PLUGIN_SNK_DOCUMENTOS: ${{ secrets.PLUGIN_SNK_DOCUMENTOS }}
          PLUGIN_SNK_DRIVERRECORDSHARING: ${{ secrets.PLUGIN_SNK_DRIVERRECORDSHARING }}
          PLUGIN_SNK_FINANCEIRO: ${{ secrets.PLUGIN_SNK_FINANCEIRO }}
          PLUGIN_SNK_FROTA: ${{ secrets.PLUGIN_SNK_FROTA }}
          PLUGIN_SNK_GERARPAGANTES: ${{ secrets.PLUGIN_SNK_GERARPAGANTES }}
          PLUGIN_SNK_PORTAL: ${{ secrets.PLUGIN_SNK_PORTAL }}
          PLUGIN_SNK_PRONTUARIO: ${{ secrets.PLUGIN_SNK_PRONTUARIO }}
          PLUGIN_SNK_PROTECAO: ${{ secrets.PLUGIN_SNK_PROTECAO }}
          # Configuração não segura do step do plugin de acesso (no local vem do .env).
          ACESSO_TENANT_ID: ${{ vars.ACESSO_TENANT_ID }}
          ACESSO_CLIENT_ID: ${{ vars.ACESSO_CLIENT_ID }}
          ACESSO_LICENSE_SKU_ID: ${{ vars.ACESSO_LICENSE_SKU_ID }}
          ACESSO_GROUP_ID: ${{ vars.ACESSO_GROUP_ID }}
          ACESSO_APP_URL: ${{ vars.ACESSO_APP_URL }}
          ACESSO_ENVIRONMENT_ID: ${{ vars.ACESSO_ENVIRONMENT_ID }}
          ACESSO_DOMINIO: ${{ vars.ACESSO_DOMINIO }}

      - if: steps.flowspend.outputs.preparos != '' && steps.pendentes.outputs.instalar == '' && steps.pendentes.outputs.motoristas_app != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
      # Flows. continue-on-error nos três passos: uma falha não pode impedir a distribuição nem o resumo; o passo "Falha nos
      # flows" deixa o job vermelho.
      # Constantes dos flows de IA (dist/ não é versionado): só quando algum flow pendente as usa. Sem dependências instaladas.
      - name: Gerar as constantes dos flows de IA
        id: constantes
        if: steps.flowspend.outputs.preparos != ''
        continue-on-error: true
        shell: bash
        env:
          PREPAROS: ${{ steps.flowspend.outputs.preparos }}
        run: |
          case ",$PREPAROS," in *,agentes-ia,*) node packages/agentes-ia/scripts/gerar-constantes.ts ;; esac
          case ",$PREPAROS," in *,despesas-ia,*) node packages/despesas-ia/scripts/gerar-constantes.ts ;; esac
      - name: Entrar no DEV como conta de serviço
        id: azlogin
        if: steps.flowspend.outputs.flows != ''
        continue-on-error: true
        run: az login --service-principal -u $env:DV_CLIENT_ID -p $env:DV_CLIENT_SECRET --tenant $env:DV_TENANT_ID --allow-no-subscriptions --output none
      - name: Publicar os flows
        id: flows
        if: steps.flowspend.outputs.flows != '' && steps.constantes.outcome != 'failure' && steps.azlogin.outcome != 'failure'
        continue-on-error: true
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File packages/deploy/push-flows-dev.ps1 -Flows "${{ steps.flowspend.outputs.flows }}"

      # Uma distribuição só, depois de tudo. Nunca derruba o deploy (a publicação já valeu); se não zerar, avisa e o
      # export para TEST/PROD fica barrado até corrigir (skill verificar-solucoes).
      - name: Distribuir nas 4 soluções
        id: distribuir
        if: steps.pendentes.outputs.tela == 'true' || steps.pendentes.outputs.webresources == 'true' || steps.pendentes.outputs.formulario == 'true' || steps.pendentes.outputs.plugins != '' || steps.flowspend.outputs.flows != ''
        run: |
          $saida = @(powershell.exe -NoProfile -ExecutionPolicy Bypass -File packages/deploy/solucoes/distribuir-apos-push.ps1 -EnvironmentUrl $env:DV_ENVIRONMENT_URL -CaixaDeEntrada AppBetinhos 2>&1 | ForEach-Object { "$_" })
          $saida | ForEach-Object { Write-Host $_ }
          if ($saida -match 'ATENCAO') { Write-Host '::warning title=Distribuição nas 4 soluções::Não zerou. O export para TEST/PROD fica barrado; veja a skill verificar-solucoes.'; 'zerou=false' >> $env:GITHUB_OUTPUT }
          else { 'zerou=true' >> $env:GITHUB_OUTPUT }

      - name: Falha nos flows
        if: steps.flows.outcome == 'failure' || steps.constantes.outcome == 'failure' || steps.azlogin.outcome == 'failure'
        shell: bash
        run: |
          echo "::error title=Flows no DEV::Algum flow falhou (causas no resumo ou nos passos anteriores). A tag flows-dev-publicado não anda."
          exit 1

      - name: Resumo
        if: always()
        shell: bash
        run: |
          {
            if [ "${{ steps.pendentes.outputs.tela }}" = "true" ]; then echo "Tela publicada no DEV - v$(node -p "require('./apps/shell/package.json').version")"; fi
            if [ "${{ steps.pendentes.outputs.webresources }}" = "true" ]; then echo; echo "Tela Gerar Pagantes publicada no DEV - v$(node -p "require('./apps/gerar-pagantes/package.json').version")"; fi
            if [ "${{ steps.pendentes.outputs.formulario }}" = "true" ]; then echo; echo "Formulário Geral publicado no DEV - v$(node -p "require('./apps/formulario-geral/version.json').version")"; fi
            if [ -n "${{ steps.pendentes.outputs.motoristas }}" ]; then echo; echo "App Motoristas no DEV (${{ steps.motoristas.outcome }}): ${{ steps.pendentes.outputs.motoristas }} - v${{ steps.motoristas.outputs.versao }}"; fi
            if [ -n "${{ steps.pendentes.outputs.plugins }}" ]; then echo; echo "Plugins publicados no DEV: ${{ steps.pendentes.outputs.plugins }}"; fi
            if [ -n "${{ steps.flowspend.outputs.flows }}" ]; then echo; echo "Flows no DEV (${{ steps.flows.outcome }}): ${{ steps.flowspend.outputs.flows }}"; fi
            if [ "${{ steps.pendentes.outputs.tela }}" != "true" ] && [ "${{ steps.pendentes.outputs.webresources }}" != "true" ] && [ "${{ steps.pendentes.outputs.formulario }}" != "true" ] && [ -z "${{ steps.pendentes.outputs.motoristas }}" ] && [ -z "${{ steps.pendentes.outputs.plugins }}" ] && [ -z "${{ steps.flowspend.outputs.flows }}" ]; then echo "Nada pendente: o DEV já tem a tela, os plugins e os flows deste commit."; fi
            if [ "${{ steps.distribuir.outputs.zerou }}" = "false" ]; then echo; echo "**ATENÇÃO:** a distribuição nas 4 soluções não zerou."; fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Pacote das soluções para o publicar.yml (export da BetinhosCore leva ~23 min; o publicar reaproveita este se a impressão
  # digital do DEV não mudou). Só com SOLUCOES_IMPRESSAO=confiar (variável do repositório) e com o job dev verde. Roda dentro do
  # grupo dataverse-dev do workflow, então o DEV não muda no meio. Exporta só a solução que mudou desde o pacote anterior (sobe a
  # versão no DEV só nesse caso; o "pular igual" da tag solucoes-<alvo> compara hash do conteúdo, sem a versão, e a versão
  # instalada no alvo, então não é afetado). Nunca deixa o Deploy vermelho: sem pacote, o publicar exporta como antes.
  # Cache do GitHub: some após 7 dias sem uso; cada Deploy restaura e grava um novo, então o mais recente fica.
  # Repositório público: workflows de PR de fork leem caches da branch padrão. O export passa pela trava de segredos
  # (segredos.ps1) e o cache guarda só pacotes.tar.enc (artefato-cifrado.sh, secret PACOTES_SENHA), com prefixo solucoes-dev-cifrado-.
  pacotes:
    needs: dev
    if: needs.dev.result == 'success' && github.ref == 'refs/heads/develop' && vars.SOLUCOES_IMPRESSAO == 'confiar'
    runs-on: windows-latest
    timeout-minutes: 60
    continue-on-error: true
    environment: dev
    env:
      DV_ENVIRONMENT_URL: ${{ vars.DV_ENVIRONMENT_URL }}
      DV_TENANT_ID: ${{ vars.DV_TENANT_ID }}
      DV_CLIENT_ID: ${{ vars.DV_CLIENT_ID }}
      DV_CLIENT_SECRET: ${{ secrets.DV_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: cache-cifrado
          key: solucoes-dev-cifrado-${{ github.sha }}
          restore-keys: solucoes-dev-cifrado-
      - name: Decifrar o pacote anterior
        # Sem cache, ou se não decifrar, exporta sem reaproveitar.
        if: hashFiles('cache-cifrado/pacotes.tar.enc') != ''
        shell: bash
        env:
          PACOTES_SENHA: ${{ secrets.PACOTES_SENHA }}
        run: |
          if ! bash packages/deploy/solucoes/artefato-cifrado.sh decifrar cache-cifrado/pacotes.tar.enc cache-solucoes; then
            echo "::warning::Pacote anterior não decifrou (PACOTES_SENHA trocado?); exporta sem reaproveitar."
            rm -rf cache-solucoes
          fi
      - name: Instalar pac
        run: |
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool
          pac auth create --name ci-dev --applicationId $env:DV_CLIENT_ID --clientSecret $env:DV_CLIENT_SECRET --tenant $env:DV_TENANT_ID --environment $env:DV_ENVIRONMENT_URL
      - name: Conferir e exportar o que mudou
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File packages/deploy/solucoes/exportar-do-dev.ps1 -EnvironmentUrl $env:DV_ENVIRONMENT_URL -Pasta pacotes-novos -Cache cache-solucoes -Confiar
          if ($LASTEXITCODE -ne 0) { throw "exportar-do-dev.ps1 falhou ($LASTEXITCODE)." }
          if (Test-Path cache-solucoes) { Remove-Item -Recurse -Force cache-solucoes }
          Move-Item pacotes-novos cache-solucoes
      - name: Cifrar o pacote
        shell: bash
        env:
          PACOTES_SENHA: ${{ secrets.PACOTES_SENHA }}
        run: |
          rm -rf cache-cifrado
          bash packages/deploy/solucoes/artefato-cifrado.sh cifrar cache-solucoes cache-cifrado/pacotes.tar.enc
      - uses: actions/cache/save@v4
        with:
          path: cache-cifrado
          key: solucoes-dev-cifrado-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Resumo
        if: always()
        shell: bash
        run: |
          { echo "## Pacote das soluções para o publicar"; echo '```json'; cat cache-solucoes/manifesto.json 2>/dev/null || echo "sem pacote"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # A tag só anda quando o Deploy inteiro passou (tela, plugins, flows e Resumo). Job à parte para que `contents: write`
  # fique só aqui: o job dev, com o segredo do Dataverse, mantém as permissões padrão. Nunca anda para trás. Execução com
  # forcar_flows não move: ela publica só os pedidos, e andar a tag apagaria os pendentes.
  tag-flows:
    needs: dev
    if: needs.dev.result == 'success' && github.ref == 'refs/heads/develop' && inputs.forcar_flows == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mover a tag flows-dev-publicado
        run: |
          if base=$(git rev-parse -q --verify 'refs/tags/flows-dev-publicado^{commit}') && ! git merge-base --is-ancestor "$base" "$GITHUB_SHA"; then
            echo "A tag está à frente deste commit; não anda para trás."
            exit 0
          fi
          git tag -f flows-dev-publicado "$GITHUB_SHA"
          git push -f origin refs/tags/flows-dev-publicado

name: Deploy

# Cada branch publica no seu ambiente: dev -> DEV, test -> TEST, prod -> PROD.
# URL, tenant, client id e secret vêm do environment do GitHub com o mesmo nome da branch.
on:
  push:
    branches: [dev, test, prod]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  BUILD_NUMBER: ${{ github.run_number }}
  SOLUTION: AppBetinhos
  RESOURCE_NAME: cr40f_SistemaBetinhos.html
  LOADER_NAME: cr40f_SistemaBetinhosLoader.html
  DISPLAY_NAME: Sistema Betinhos

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # DEV é não gerenciado e é onde schema e flows são editados; a branch só publica a tela.
  # O caminho inverso (DEV -> repo) é o workflow "Sincronizar solução do DEV".
  dev:
    if: github.ref_name == 'dev'
    needs: ci
    runs-on: windows-latest
    environment: dev
    env:
      DV_ENVIRONMENT_URL: ${{ vars.DV_ENVIRONMENT_URL }}
      DV_BLOCKED_HOSTS: ${{ vars.DV_BLOCKED_HOSTS }}
      DV_TENANT_ID: ${{ vars.DV_TENANT_ID }}
      DV_CLIENT_ID: ${{ vars.DV_CLIENT_ID }}
      DV_CLIENT_SECRET: ${{ secrets.DV_CLIENT_SECRET }}
      DV_SOLUTION: AppBetinhos
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm push

  # TEST e PROD recebem a solução inteira como managed: tela, schema, flows e plugins.
  managed:
    if: github.ref_name != 'dev'
    needs: ci
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Injeta o build na solução
        run: node packages/deploy/inject-solution.mjs apps/shell "solution/$SOLUTION" "$RESOURCE_NAME" "$LOADER_NAME" "$DISPLAY_NAME"
      - name: Instala o Power Platform CLI
        run: dotnet tool install --global Microsoft.PowerApps.CLI.Tool
      - name: Empacota como managed
        run: |
          mkdir -p out
          pac solution pack --zipfile "out/${SOLUTION}_managed.zip" --folder "solution/$SOLUTION" --packagetype Managed
      - name: Importa em ${{ github.ref_name }}
        env:
          DV_ENVIRONMENT_URL: ${{ vars.DV_ENVIRONMENT_URL }}
          DV_TENANT_ID: ${{ vars.DV_TENANT_ID }}
          DV_CLIENT_ID: ${{ vars.DV_CLIENT_ID }}
          DV_CLIENT_SECRET: ${{ secrets.DV_CLIENT_SECRET }}
        run: |
          pac auth create --environment "$DV_ENVIRONMENT_URL" --tenant "$DV_TENANT_ID" --applicationId "$DV_CLIENT_ID" --clientSecret "$DV_CLIENT_SECRET"
          pac solution import --path "out/${SOLUTION}_managed.zip" --activate-plugins --async --max-async-wait-time 90
      - name: Versão publicada
        run: echo "Publicado em ${{ github.ref_name }} - v$(node -p "require('./apps/shell/package.json').version")" >> "$GITHUB_STEP_SUMMARY"

name: CI

on:
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          # @betinhos/ui vem do GitHub Packages (repo design-system-betinhos). Lê com o secret PACKAGES_READ_TOKEN
          # (PAT read:packages) e, sem ele, com o GITHUB_TOKEN liberado em Manage Actions access do pacote.
          registry-url: https://npm.pkg.github.com
          scope: '@betinhos-executive-service'
      - name: Diagnóstico temporário do acesso ao GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          for p in ui tokens; do
            code=$(curl -s -o /tmp/meta.json -w "%{http_code}" -H "Authorization: Bearer $NODE_AUTH_TOKEN" "https://npm.pkg.github.com/@betinhos-executive-service%2F$p")
            echo "$p -> HTTP $code"; head -c 300 /tmp/meta.json; echo
          done
          echo "userconfig=$NPM_CONFIG_USERCONFIG"; sed 's/_authToken=.*/_authToken=<oculto>/' "$NPM_CONFIG_USERCONFIG" || true
          pnpm config get @betinhos-executive-service:registry || true
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
      - run: pnpm typecheck
      - run: pnpm test
      - name: Varredura de segredos na solução
        run: node packages/deploy/scan-secrets.mjs solution

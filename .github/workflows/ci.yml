name: CI

on:
  pull_request:
  workflow_call:
  # Rodar à mão (Actions › CI › Run workflow) para conferir a main sem abrir PR.
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          # @betinhos/ui vem do GitHub Packages (repo design-system-betinhos). O GITHUB_TOKEN lê porque cada pacote
          # (ui e tokens) lista este repo em Package settings → Manage Actions access (Read).
          registry-url: https://npm.pkg.github.com
          scope: '@betinhos-executive-service'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Sem dado pessoal real (CPF válido, e-mail de pessoa, backup de flow) no repositório.
      - run: node --test scripts/dados-pessoais.test.mjs && node scripts/dados-pessoais.mjs
      - run: pnpm typecheck
      - run: pnpm test
      - name: Varredura de segredos na solução
        run: node packages/deploy/scan-secrets.mjs solution

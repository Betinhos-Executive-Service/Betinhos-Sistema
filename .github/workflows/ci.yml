name: CI

on:
  pull_request:
  workflow_call:
  # Rodar à mão (Actions › CI › Run workflow) para conferir a main sem abrir PR.
  workflow_dispatch:

# Push novo no mesmo PR cancela o run anterior (repo privado: minuto de CI é cobrado). Fora de PR nada é cancelado.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Tudo roda em paralelo e o job "CI ok" junta num resultado só. O que manda no tempo do CI é o job mais lento:
# - shell: testes em fatias paralelas (vitest --shard), equilibradas pelo tempo de cada arquivo
#   (apps/shell/tempos-testes.json), mais o typecheck do shell numa parte própria. Só quando o PR mexe em algo que o
#   shell usa; cada parte decide sozinha (.github/scripts/ci-mudancas.sh) para não esperar outro job antes de começar.
# - checagens: typecheck e testes dos outros pacotes, dados pessoais, segredos e sintaxe dos .ps1.
# - plugins (Windows) e acompanhar-motorista: só quando o PR os toca (job "mudancas").
jobs:
  # Fora de PR (manual ou workflow_call) roda tudo.
  mudancas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      shell: ${{ steps.filtro.outputs.shell }}
      plugins: ${{ steps.filtro.outputs.plugins }}
      acompanhar: ${{ steps.filtro.outputs.acompanhar }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - id: filtro
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/ci-mudancas.sh

  checagens:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar-pnpm
      # Sem dado pessoal real (CPF válido, e-mail de pessoa, backup de flow) no repositório.
      - run: node --test scripts/dados-pessoais.test.mjs && node scripts/dados-pessoais.mjs
      # Os .ps1 de publicação só rodam no Deploy e no Produção: erro de sintaxe apareceria tarde, no meio de uma publicação.
      - name: Sintaxe dos scripts PowerShell
        shell: pwsh
        run: |
          $falhas = 0
          $arquivos = @(git -c core.quotepath=off ls-files '*.ps1')
          foreach ($f in $arquivos) {
            $erros = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path -LiteralPath $f).Path, [ref]$null, [ref]$erros)
            foreach ($e in $erros) {
              Write-Host "::error file=$f,line=$($e.Extent.StartLineNumber)::$($e.Message)"
              $falhas++
            }
          }
          Write-Host "$($arquivos.Count) arquivos, $falhas erro(s)"
          if ($falhas) { exit 1 }
      - name: Varredura de segredos na solução
        run: node packages/deploy/scan-secrets.mjs solution
      # Todo pacote com script typecheck, menos o shell (escala-fds, gerar-pagantes, motoristas, portal-cliente e worker,
      # agentes-ia, app-config, despesas-ia). O do shell é o mais lento (~30 s) e roda no job "shell (tipos)", só quando
      # o PR mexe no shell.
      - name: Typecheck (exceto shell)
        run: pnpm -r --if-present --filter '!@betinhos/shell' typecheck
      - name: Sintaxe dos Workers sem typecheck (cadastro-passageiro e backups)
        run: pnpm --filter @betinhos/cadastro-passageiro --filter @betinhos/backups check
      # Inclui @betinhos/formulario-geral (build do webresource + 19 testes do app).
      # O acompanhar-motorista tem job próprio (só roda quando o PR o toca).
      - name: Testes (exceto shell e acompanhar-motorista)
        run: pnpm -r --filter '!@betinhos/shell' --filter '!@betinhos/acompanhar-motorista' test
      # O WebResource do App Motoristas é um HTML só; sem número de versão novo (quem sobe a versão é a publicação).
      - name: Build do App Motoristas
        run: pnpm --filter @betinhos/motoristas exec node scripts/build-react-singlefile.cjs --no-version

  # Schema por migration (packages/deploy/migrations/README.md): migration publicada é imutável e schema novo não entra por provision-*.
  schema:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Migrations
        env:
          BASE: ${{ github.base_ref }}
        run: git diff --name-status -M "origin/$BASE...HEAD" | node packages/deploy/migrations-ci.mjs

  # PR que não toca o shell nem o que ele lê (dataverse, app-config, fixtures dos plugins, catálogo de acessos,
  # dependências) termina no filtro, sem instalar nada.
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        parte: [tipos, 1/4, 2/4, 3/4, 4/4]
    name: shell (${{ matrix.parte }})
    steps:
      - uses: actions/checkout@v4
      - id: filtro
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/ci-mudancas.sh
      # Só o shell e o que ele usa do workspace (@betinhos/dataverse e @betinhos/app-config).
      - if: steps.filtro.outputs.shell == 'true'
        uses: ./.github/actions/preparar-pnpm
        with:
          filtro: --filter @betinhos/shell...
      - if: steps.filtro.outputs.shell == 'true' && matrix.parte == 'tipos'
        run: pnpm --filter @betinhos/shell typecheck
      - if: steps.filtro.outputs.shell == 'true' && matrix.parte != 'tipos'
        run: pnpm --filter @betinhos/shell exec vitest run --shard=${{ matrix.parte }}

  # Worker acompanhar-motorista (apps/acompanhar-motorista): check (node --check + tsc), testes (node:test + vitest) e build do front.
  # Só roda quando o PR toca o app. Nunca publica nem chama wrangler (a publicação é do deploy.yml e do producao.yml).
  acompanhar-motorista:
    needs: mudancas
    if: needs.mudancas.outputs.acompanhar == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar-pnpm
        with:
          filtro: --filter @betinhos/acompanhar-motorista...
      - run: pnpm --filter @betinhos/acompanhar-motorista check
      - run: pnpm --filter @betinhos/acompanhar-motorista test
      - run: pnpm --filter @betinhos/acompanhar-motorista build

  # Testes dos plugins (net48, só Windows) e build dos registradores, só dos plugins que o PR toca. O workflow Deploy
  # publica sem repetir os testes. Sem assinatura aqui: a chave fica só no environment dev.
  plugins:
    needs: mudancas
    if: needs.mudancas.outputs.plugins != ''
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('packages/plugins/**/*.csproj', 'apps/formulario-geral/power-platform/plugins/**/*.csproj', 'packages/planner/power-platform/plugins/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Testes e registradores
        env:
          PLUGINS: ${{ needs.mudancas.outputs.plugins }}
        run: |
          # nome curto -> pasta do código (Cr40f.<Nome>.Plugin, Betinhos.DriverRecordSharing e Betinhos.ExpenseUpload, este só compila e testa;
          # AutoNumberGuard mora no app do Formulário Geral e também só compila e testa)
          $pastas = @{}
          foreach ($d in Get-ChildItem packages/plugins -Directory) { if ($d.Name -match '^(?:Cr40f\.(?<n>[A-Za-z]+)\.Plugin|Betinhos\.(?<n>DriverRecordSharing|ExpenseUpload))$') { $pastas[$Matches['n'].ToLowerInvariant()] = "packages/plugins/$($d.Name)" } }
          $pastas['autonumberguard'] = 'apps/formulario-geral/power-platform/plugins/AutoNumberGuard'
          # Planner: PlannerNotifications (sininho) e QuoteAutoNumberGuard, também só compilam e testam
          foreach ($n in 'PlannerNotifications', 'QuoteAutoNumberGuard') { $pastas[$n.ToLowerInvariant()] = "packages/planner/power-platform/plugins/$n" }
          $pedidos = if ($env:PLUGINS -eq 'todos') { @($pastas.Keys | Sort-Object) } else { @($env:PLUGINS.Split(',') | Where-Object { $_ -and $pastas.ContainsKey($_) }) }
          foreach ($nome in $pedidos) {
            $dir = $pastas[$nome]
            $p = Split-Path -Leaf $dir
            Write-Host "::group::$p"
            $testes = "$dir.Tests"
            if (Test-Path $testes) { dotnet test $testes -p:SignAssembly=false; if ($LASTEXITCODE) { throw "testes de $p falharam" } }
            else { dotnet build $dir -p:SignAssembly=false; if ($LASTEXITCODE) { throw "build de $p falhou" } }
            # Registrador só existe nos Cr40f.*; Betinhos.* não tem (o DriverRecordSharing atualiza o assembly já registrado).
            $registrador = "packages/plugins/tools/$($p -replace '\.Plugin$', '.Registrar')"
            if (Test-Path $registrador) { dotnet build $registrador; if ($LASTEXITCODE) { throw "registrador de $p não compila" } }
            Write-Host "::endgroup::"
          }

  ok:
    name: CI ok
    if: always()
    needs: [mudancas, checagens, schema, shell, plugins, acompanhar-motorista]
    runs-on: ubuntu-latest
    steps:
      # O shell sempre roda (quando o PR não o toca, cada parte termina no próprio filtro), então tem de dar success.
      # plugins e acompanhar-motorista "skipped" só valem quando o filtro decidiu pular; se o filtro falhou, o CI falha.
      - run: |
          echo "mudancas: ${{ needs.mudancas.result }} (shell=${{ needs.mudancas.outputs.shell }}, plugins=${{ needs.mudancas.outputs.plugins }}) | checagens: ${{ needs.checagens.result }} | shell: ${{ needs.shell.result }} | plugins: ${{ needs.plugins.result }} | acompanhar-motorista: ${{ needs.acompanhar-motorista.result }} (${{ needs.mudancas.outputs.acompanhar }})"
          test "${{ needs.mudancas.result }}" = success
          test "${{ needs.checagens.result }}" = success
          test "${{ needs.shell.result }}" = success
          if [ "${{ github.event_name }}" = pull_request ]; then test "${{ needs.schema.result }}" = success; fi
          if [ -n "${{ needs.mudancas.outputs.plugins }}" ]; then test "${{ needs.plugins.result }}" = success; fi
          if [ "${{ needs.mudancas.outputs.acompanhar }}" = true ]; then test "${{ needs.acompanhar-motorista.result }}" = success; fi

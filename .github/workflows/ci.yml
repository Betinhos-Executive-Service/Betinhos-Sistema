name: CI

on:
  pull_request:
  workflow_call:
  # Rodar à mão (Actions › CI › Run workflow) para conferir a main sem abrir PR.
  workflow_dispatch:

# Push novo no mesmo PR cancela o run anterior (repo privado: minuto de CI é cobrado). Fora de PR nada é cancelado.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Os testes do shell são quase todo o tempo do CI (~95%): rodam divididos em fatias paralelas (vitest --shard),
# equilibradas pelo tempo de cada arquivo (apps/shell/tempos-testes.json), e só quando o PR mexe em algo que o shell usa.
# O resto (typecheck de todos os pacotes, testes dos outros pacotes, dados pessoais e segredos) roda num job ao lado.
# O job "CI ok" junta tudo num resultado só.
jobs:
  # PR que não toca o shell nem o que os testes dele leem (dataverse, fixtures dos plugins, dependências) pula as fatias.
  # Fora de PR (manual ou workflow_call) roda tudo.
  mudancas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      shell: ${{ steps.filtro.outputs.shell }}
      plugins: ${{ steps.filtro.outputs.plugins }}
    steps:
      - id: filtro
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$PR" ]; then echo "shell=true" >> "$GITHUB_OUTPUT"; echo "plugins=todos" >> "$GITHUB_OUTPUT"; exit 0; fi
          arquivos=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)')
          # Plugins tocados (código, testes, registrador ou script de publicação), em minúsculas: frota,acesso,driverrecordsharing,autonumberguard
          # (este último mora em apps/formulario-geral/power-platform/plugins).
          plugins=$(echo "$arquivos" | sed -nE 's#^packages/plugins/(Cr40f\.([A-Za-z]+)\.Plugin(\.Tests)?|tools/Cr40f\.([A-Za-z]+)\.Registrar|Betinhos\.(DriverRecordSharing|ExpenseUpload)(\.Tests)?)/.*#\2\4\5#p; s#^packages/plugins/scripts/push-([a-z]+)-plugin\.ps1$#\1#p; s#^apps/formulario-geral/power-platform/plugins/(AutoNumberGuard)(\.Tests)?/.*#\1#p' | tr 'A-Z' 'a-z' | sort -u | paste -sd, -)
          if echo "$arquivos" | grep -qE '^\.github/workflows/ci\.yml$'; then plugins=todos; fi
          echo "plugins=$plugins" >> "$GITHUB_OUTPUT"
          if echo "$arquivos" | grep -qE '^(apps/shell/|packages/dataverse/|packages/plugins/[^/]+/Fixtures/|\.github/workflows/ci\.yml$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|package\.json$|tsconfig\.base\.json$|\.npmrc$)'; then
            echo "shell=true" >> "$GITHUB_OUTPUT"
          else
            echo "shell=false" >> "$GITHUB_OUTPUT"
            echo "PR sem mudança que afete o shell: fatias do shell puladas." >> "$GITHUB_STEP_SUMMARY"
          fi

  checagens:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          # @betinhos/ui vem do GitHub Packages (repo design-system-betinhos). O GITHUB_TOKEN lê porque cada pacote
          # (ui e tokens) lista este repo em Package settings → Manage Actions access (Read).
          registry-url: https://npm.pkg.github.com
          scope: '@betinhos-executive-service'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Sem dado pessoal real (CPF válido, e-mail de pessoa, backup de flow) no repositório.
      - run: node --test scripts/dados-pessoais.test.mjs && node scripts/dados-pessoais.mjs
      # Os .ps1 de publicação só rodam no Deploy e no Produção: erro de sintaxe apareceria tarde, no meio de uma publicação.
      - name: Sintaxe dos scripts PowerShell
        shell: pwsh
        run: |
          $falhas = 0
          $arquivos = @(git -c core.quotepath=off ls-files '*.ps1')
          foreach ($f in $arquivos) {
            $erros = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path -LiteralPath $f).Path, [ref]$null, [ref]$erros)
            foreach ($e in $erros) {
              Write-Host "::error file=$f,line=$($e.Extent.StartLineNumber)::$($e.Message)"
              $falhas++
            }
          }
          Write-Host "$($arquivos.Count) arquivos, $falhas erro(s)"
          if ($falhas) { exit 1 }
      - name: Varredura de segredos na solução
        run: node packages/deploy/scan-secrets.mjs solution
      # Todo pacote com script typecheck (shell, escala-fds, portal-cliente e worker, agentes-ia, despesas-ia).
      - name: Typecheck
        run: pnpm -r --if-present typecheck
      - name: Sintaxe do cadastro-passageiro
        run: pnpm --filter @betinhos/cadastro-passageiro check
      # Inclui @betinhos/formulario-geral (build do webresource + 19 testes do app).
      - name: Testes (exceto shell)
        run: pnpm -r --filter '!@betinhos/shell' test
      # O WebResource do App Motoristas é um HTML só; sem número de versão novo (quem sobe a versão é a publicação).
      - name: Build do App Motoristas
        run: pnpm --filter @betinhos/motoristas exec node scripts/build-react-singlefile.cjs --no-version

  shell:
    needs: mudancas
    if: needs.mudancas.outputs.shell == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        fatia: [1, 2, 3]
    name: shell (${{ matrix.fatia }}/3)
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@betinhos-executive-service'
      # Só o shell e o que ele usa do workspace (@betinhos/dataverse).
      - run: pnpm install --frozen-lockfile --filter @betinhos/shell...
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm --filter @betinhos/shell exec vitest run --shard=${{ matrix.fatia }}/3

  # Testes dos plugins (net48, só Windows) e build dos registradores, só dos plugins que o PR toca. O workflow Deploy
  # publica sem repetir os testes. Sem assinatura aqui: a chave fica só no environment dev.
  plugins:
    needs: mudancas
    if: needs.mudancas.outputs.plugins != ''
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('packages/plugins/**/*.csproj', 'apps/formulario-geral/power-platform/plugins/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Testes e registradores
        env:
          PLUGINS: ${{ needs.mudancas.outputs.plugins }}
        run: |
          # nome curto -> pasta do código (Cr40f.<Nome>.Plugin, Betinhos.DriverRecordSharing e Betinhos.ExpenseUpload, este só compila e testa;
          # AutoNumberGuard mora no app do Formulário Geral e também só compila e testa)
          $pastas = @{}
          foreach ($d in Get-ChildItem packages/plugins -Directory) { if ($d.Name -match '^(?:Cr40f\.(?<n>[A-Za-z]+)\.Plugin|Betinhos\.(?<n>DriverRecordSharing|ExpenseUpload))$') { $pastas[$Matches['n'].ToLowerInvariant()] = "packages/plugins/$($d.Name)" } }
          $pastas['autonumberguard'] = 'apps/formulario-geral/power-platform/plugins/AutoNumberGuard'
          $pedidos = if ($env:PLUGINS -eq 'todos') { @($pastas.Keys | Sort-Object) } else { @($env:PLUGINS.Split(',') | Where-Object { $_ -and $pastas.ContainsKey($_) }) }
          foreach ($nome in $pedidos) {
            $dir = $pastas[$nome]
            $p = Split-Path -Leaf $dir
            Write-Host "::group::$p"
            $testes = "$dir.Tests"
            if (Test-Path $testes) { dotnet test $testes -p:SignAssembly=false; if ($LASTEXITCODE) { throw "testes de $p falharam" } }
            else { dotnet build $dir -p:SignAssembly=false; if ($LASTEXITCODE) { throw "build de $p falhou" } }
            # Registrador só existe nos Cr40f.*; Betinhos.* não tem (o DriverRecordSharing atualiza o assembly já registrado).
            $registrador = "packages/plugins/tools/$($p -replace '\.Plugin$', '.Registrar')"
            if (Test-Path $registrador) { dotnet build $registrador; if ($LASTEXITCODE) { throw "registrador de $p não compila" } }
            Write-Host "::endgroup::"
          }

  ok:
    name: CI ok
    if: always()
    needs: [mudancas, checagens, shell, plugins]
    runs-on: ubuntu-latest
    steps:
      # shell "skipped" só vale quando o filtro decidiu pular; se o filtro falhou, o CI falha.
      - run: |
          echo "mudancas: ${{ needs.mudancas.result }} (shell=${{ needs.mudancas.outputs.shell }}, plugins=${{ needs.mudancas.outputs.plugins }}) | checagens: ${{ needs.checagens.result }} | shell: ${{ needs.shell.result }} | plugins: ${{ needs.plugins.result }}"
          test "${{ needs.mudancas.result }}" = success
          test "${{ needs.checagens.result }}" = success
          if [ "${{ needs.mudancas.outputs.shell }}" = true ]; then test "${{ needs.shell.result }}" = success; fi
          if [ -n "${{ needs.mudancas.outputs.plugins }}" ]; then test "${{ needs.plugins.result }}" = success; fi

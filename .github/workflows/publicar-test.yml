name: Publicar TEST

# Leva as 4 soluções gerenciadas (BetinhosCore, BetinhosAutomacao, BetinhosInterface, BetinhosMotoristas) do DEV para o
# TEST: tabelas, colunas, formulários, visões, flows, plugins, WebResources, app e sitemap. Dados não vão por solução.
# Só TEST: o import recusa qualquer outro host (Assert-HostTest). PROD fica para depois do corte da Fase 2.
#  - exportar (environment dev): conferência das 4 no DEV (barreira), versão seguinte e export gerenciado conferido;
#  - importar (environment test, com revisor obrigatório): foto antes, import com upgrade, foto depois e
#    comparar-fotos --travado. Qualquer perda (registros, componentes, fluxo ou step que mudou de estado) reprova.
on:
  workflow_dispatch:
    inputs:
      solucoes:
        description: 'Soluções separadas por vírgula (vazio = as 4)'
        required: false
        default: ''

concurrency:
  group: publicar-test
  cancel-in-progress: false

jobs:
  exportar:
    runs-on: windows-latest
    timeout-minutes: 60
    environment: dev
    env:
      DV_ENVIRONMENT_URL: ${{ vars.DV_ENVIRONMENT_URL }}
      DV_TENANT_ID: ${{ vars.DV_TENANT_ID }}
      DV_CLIENT_ID: ${{ vars.DV_CLIENT_ID }}
      DV_CLIENT_SECRET: ${{ secrets.DV_CLIENT_SECRET }}
      SOLUCOES: ${{ inputs.solucoes }}
    steps:
      - uses: actions/checkout@v4
      - name: Instalar pac
        run: |
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool
          pac auth create --name ci-dev --applicationId $env:DV_CLIENT_ID --clientSecret $env:DV_CLIENT_SECRET --tenant $env:DV_TENANT_ID --environment $env:DV_ENVIRONMENT_URL
      - name: Conferir, subir versão e exportar
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File packages/deploy/solucoes/exportar-para-test.ps1 -EnvironmentUrl $env:DV_ENVIRONMENT_URL -Solucoes "$env:SOLUCOES" -Pasta pacotes
      - uses: actions/upload-artifact@v4
        with:
          name: pacotes
          path: pacotes/
          retention-days: 30

  importar:
    needs: exportar
    runs-on: windows-latest
    timeout-minutes: 180
    environment: test
    env:
      DV_ENVIRONMENT_URL: ${{ vars.DV_ENVIRONMENT_URL }}
      DV_TENANT_ID: ${{ vars.DV_TENANT_ID }}
      DV_CLIENT_ID: ${{ vars.DV_CLIENT_ID }}
      DV_CLIENT_SECRET: ${{ secrets.DV_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: pacotes
          path: pacotes
      - name: Instalar pac
        run: |
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool
          pac auth create --name ci-test --applicationId $env:DV_CLIENT_ID --clientSecret $env:DV_CLIENT_SECRET --tenant $env:DV_TENANT_ID --environment $env:DV_ENVIRONMENT_URL
      - name: Foto antes
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File packages/deploy/solucoes/foto-ambiente.ps1 -EnvironmentUrl $env:DV_ENVIRONMENT_URL -Saida fotos/antes.json -Solucoes "BetinhosCore,BetinhosAutomacao,BetinhosInterface,BetinhosMotoristas"
      - name: Importar
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File packages/deploy/solucoes/importar-no-test.ps1 -EnvironmentUrl $env:DV_ENVIRONMENT_URL -Pasta pacotes
      - name: Foto depois
        if: always()
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File packages/deploy/solucoes/foto-ambiente.ps1 -EnvironmentUrl $env:DV_ENVIRONMENT_URL -Saida fotos/depois.json -Solucoes "BetinhosCore,BetinhosAutomacao,BetinhosInterface,BetinhosMotoristas"
      - name: Comparar (travado)
        shell: bash
        run: |
          set -o pipefail
          node packages/deploy/solucoes/comparar-fotos.mjs --travado fotos/antes.json fotos/depois.json | tee fotos/comparacao.json
      - name: Resumo
        if: always()
        shell: bash
        run: |
          {
            echo "## Publicar TEST"
            echo '```json'
            cat pacotes/importados.json 2>/dev/null || echo "import não concluído"
            echo '```'
            echo "Comparação: veja o artefato \`fotos\` (comparacao.json). Perda reprova a execução."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fotos
          path: |
            fotos/
            pacotes/importados.json
          retention-days: 90

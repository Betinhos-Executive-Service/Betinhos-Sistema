name: Importar soluções (reutilizável)

# Importa no TEST ou no PROD os pacotes que o job "exportar" do publicar.yml deixou no artefato "pacotes" (mesma execução,
# cifrado com o secret PACOTES_SENHA e decifrado aqui). Os backups das camadas Active e das Custom APIs (JSON com o conteúdo
# de WebResource, flow e step) sobem cifrados no artefato backups-<alvo>; fotos-<alvo> fica em claro (só hashes e nomes):
# foto antes, backup (só PROD), exclusão das Custom APIs cr40f_AI*V2 não gerenciadas (legado que trava o upgrade), import com
# upgrade, remoção das camadas Active (hotfixes e telas publicadas direto no ambiente; a main já contém todos), estados
# ligado/desligado devolvidos ao que a foto registrou, foto depois e comparação. Qualquer perda reprova.
# Ordem pensada para o PROD nunca servir versão antiga: as camadas Active só saem depois de a versão nova estar importada.
# No TEST (cópia travada do PROD) a comparação usa --travado e os fluxos/steps novos são desligados, para o ensaio não
# mandar nada a clientes reais.
on:
  workflow_call:
    inputs:
      alvo:
        description: 'test ou prod'
        type: string
        required: true
      backup:
        description: 'PROD: rótulo de um backup manual já feito. Vazio = o job faz o backup (pac admin backup).'
        type: string
        required: false
        default: ''
      importar_tudo:
        description: 'Importa as soluções mesmo com conteúdo igual ao da última publicação neste ambiente.'
        type: boolean
        required: false
        default: false
      sem_upgrade:
        description: 'Ensaio, só no TEST: soluções (vírgula, ou todas) importadas como update, sem --stage-and-upgrade.'
        type: string
        required: false
        default: ''

jobs:
  importar:
    runs-on: windows-latest
    timeout-minutes: 240
    # O environment prod não tem revisor: a aprovação é o job aprovar-prod (environment prod-aprovacao) de quem chama.
    environment: ${{ inputs.alvo }}
    # O mesmo grupo do retirar-caixa.yml e do caminho "front" do producao.yml: uma escrita por ambiente de cada vez.
    concurrency:
      group: publicar-${{ inputs.alvo }}
      cancel-in-progress: false
    env:
      DV_ENVIRONMENT_URL: ${{ vars.DV_ENVIRONMENT_URL }}
      DV_TENANT_ID: ${{ vars.DV_TENANT_ID }}
      DV_CLIENT_ID: ${{ vars.DV_CLIENT_ID }}
      DV_CLIENT_SECRET: ${{ secrets.DV_CLIENT_SECRET }}
      ALVO_PS: ${{ inputs.alvo == 'prod' && 'Prod' || 'Test' }}
      TRAVADO: ${{ inputs.alvo == 'test' && '--travado' || '' }}
      DESLIGAR_NOVOS: ${{ inputs.alvo == 'test' }}
      IMPORTAR_TUDO: ${{ inputs.importar_tudo }}
      SEM_UPGRADE: ${{ inputs.sem_upgrade }}
      TAG_PUBLICADAS: solucoes-${{ inputs.alvo }}
      # Id da conexão do Web Push neste ambiente. Obrigatória no PROD quando a BetinhosAutomacao vai junto (importar-solucoes.ps1).
      CONEXAO_WEBPUSH: ${{ vars.CONEXAO_WEBPUSH }}
      # Primeiro vínculo do Web Push num ambiente: true pula o --settings-file, e o dono da conexão vincula depois do import.
      # Apague a variável depois do vínculo (solucoes.ps1, Get-ConexaoWebPushDoImport).
      WEBPUSH_VINCULAR_DEPOIS: ${{ vars.WEBPUSH_VINCULAR_DEPOIS }}
    steps:
      - name: Alvo válido
        shell: bash
        run: |
          case "${{ inputs.alvo }}" in test|prod) ;; *) echo "::error::alvo inválido: ${{ inputs.alvo }}"; exit 1 ;; esac
          if [ -n "$SEM_UPGRADE" ] && [ "${{ inputs.alvo }}" != "test" ]; then echo "::error::sem_upgrade é só ensaio no TEST."; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: pacotes
          path: pacotes-cifrado
      - name: Decifrar os pacotes
        shell: bash
        env:
          PACOTES_SENHA: ${{ secrets.PACOTES_SENHA }}
        run: bash packages/deploy/solucoes/artefato-cifrado.sh decifrar pacotes-cifrado/pacotes.tar.enc pacotes
      - uses: ./.github/actions/instalar-pac
      - name: Conectar o pac
        run: |
          pac auth create --name ci-alvo --applicationId $env:DV_CLIENT_ID --clientSecret $env:DV_CLIENT_SECRET --tenant $env:DV_TENANT_ID --environment $env:DV_ENVIRONMENT_URL
      - name: Backup do PROD
        # A conta de serviço precisa estar registrada como app de administração (pac admin application register, uma vez).
        # Sem backup, nada é importado no PROD.
        if: inputs.alvo == 'prod'
        env:
          BACKUP: ${{ inputs.backup }}
        run: |
          if ($env:BACKUP) {
            Write-Host "Backup informado: $env:BACKUP"
            "rotulo=$env:BACKUP" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
            exit 0
          }
          $rotulo = "producao-$($env:GITHUB_SHA.Substring(0,7))-$env:GITHUB_RUN_ID"
          pac admin backup --environment $env:DV_ENVIRONMENT_URL --label $rotulo
          if ($LASTEXITCODE -ne 0) { throw "Backup do PROD falhou. Nada foi importado. Faça o backup à mão e rode 'Publicar soluções' com o rótulo." }
          "## Backup do PROD: $rotulo" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
      # Antes da foto: a variável que só tinha padrão ganha valor atual, e a comparação passa a provar que esse valor sobreviveu.
      # Com a foto antes daqui, a variável aparece sem valor em antes.json e com valor em depois.json, e reprova sem perda nenhuma.
      - name: Preservar valores de variáveis que só têm padrão (o pacote do DEV substitui o padrão)
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File packages/deploy/solucoes/preservar-valores-variaveis.ps1 -EnvironmentUrl $env:DV_ENVIRONMENT_URL -Alvo $env:ALVO_PS -Aplicar
      - name: Foto antes
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File packages/deploy/solucoes/foto-ambiente.ps1 -EnvironmentUrl $env:DV_ENVIRONMENT_URL -Saida fotos/antes.json
      - name: Excluir Custom APIs legado (cr40f_AI*V2 não gerenciadas)
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File packages/deploy/solucoes/excluir-custom-apis-legado.ps1 -EnvironmentUrl $env:DV_ENVIRONMENT_URL -Alvo $env:ALVO_PS -Backup custom-apis-legado -Aplicar
      - name: Guardar configuração dos steps (o pacote traz a do DEV)
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File packages/deploy/solucoes/preservar-config-steps.ps1 -EnvironmentUrl $env:DV_ENVIRONMENT_URL -Alvo $env:ALVO_PS -Arquivo config-steps/antes.json
      - name: Última publicação neste ambiente
        # A tag solucoes-<alvo> guarda versão e hash de cada solução na última publicação que passou. Sem ela, importa tudo.
        shell: bash
        run: |
          if git fetch --quiet --no-tags origin "+refs/tags/$TAG_PUBLICADAS:refs/tags/$TAG_PUBLICADAS"; then
            git tag -l --format='%(contents)' "$TAG_PUBLICADAS" > publicadas-antes.json
          fi
      - name: Importar
        run: |
          $extra = @(); if ($env:IMPORTAR_TUDO -eq 'true') { $extra += '-ImportarTudo' }
          if ($env:SEM_UPGRADE) { $extra += @('-SemUpgrade', $env:SEM_UPGRADE) }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File packages/deploy/solucoes/importar-solucoes.ps1 -EnvironmentUrl $env:DV_ENVIRONMENT_URL -Pasta pacotes -Alvo $env:ALVO_PS -Publicadas publicadas-antes.json @extra
          if ($LASTEXITCODE -ne 0) { throw "importar-solucoes.ps1 falhou ($LASTEXITCODE)." }
      - name: Remover camadas Active (hotfixes já na main)
        # Publicação parcial (input solucoes) só mexe nas camadas das soluções importadas. Sem isso, publicar só a BetinhosCore
        # apagaria no PROD a camada Active de tela, flows e plugins da Automação e da Interface, e o PROD voltaria à versão
        # gerenciada antiga até a publicação seguinte. Com as 4, segue o padrão do script (inclui a AppBetinhos).
        run: |
          $nomes = @((Get-Content -Raw pacotes/manifesto.json | ConvertFrom-Json) | ForEach-Object { $_.solucao })
          $todas = @('BetinhosCore', 'BetinhosAutomacao', 'BetinhosMotoristas', 'BetinhosInterface')
          $extra = @()
          if (@($todas | Where-Object { $nomes -notcontains $_ }).Count) { $extra = @('-Solucoes', ($nomes -join ',')) }
          Write-Host "camadas Active de: $(if ($extra) { $nomes -join ', ' } else { 'AppBetinhos e as 4 soluções' })"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File packages/deploy/solucoes/remover-camadas-active.ps1 -EnvironmentUrl $env:DV_ENVIRONMENT_URL -Backup camadas-active -Aplicar -PermitirProd @extra
          if ($LASTEXITCODE -ne 0) { throw "remover-camadas-active.ps1 falhou ($LASTEXITCODE)." }
      - name: Restaurar configuração dos steps (depois das camadas Active, que a apagariam)
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File packages/deploy/solucoes/preservar-config-steps.ps1 -EnvironmentUrl $env:DV_ENVIRONMENT_URL -Alvo $env:ALVO_PS -Arquivo config-steps/antes.json -Restaurar
      - name: Restaurar estados ligado/desligado
        # -DesligarNovos é switch: powershell.exe -File recusa "-DesligarNovos:True"; o switch entra por splat só no TEST.
        run: |
          $extra = @(); if ($env:DESLIGAR_NOVOS -eq 'true') { $extra += '-DesligarNovos' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File packages/deploy/solucoes/restaurar-estados.ps1 -EnvironmentUrl $env:DV_ENVIRONMENT_URL -Alvo $env:ALVO_PS -Foto fotos/antes.json -Saida fotos/estados.json @extra
      - name: Foto depois
        if: always()
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File packages/deploy/solucoes/foto-ambiente.ps1 -EnvironmentUrl $env:DV_ENVIRONMENT_URL -Saida fotos/depois.json
      - name: Comparar
        if: always()
        shell: bash
        run: |
          set -o pipefail
          node packages/deploy/solucoes/comparar-fotos.mjs $TRAVADO fotos/antes.json fotos/depois.json | tee fotos/comparacao.json
      - name: Registrar a publicação neste ambiente
        # Só com tudo verde: o que falhou volta a ser importado na próxima.
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -f -a --cleanup=verbatim -F pacotes/publicadas.json "$TAG_PUBLICADAS" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG_PUBLICADAS"
      - name: Resumo
        if: always()
        shell: bash
        run: |
          {
            echo "## Publicar soluções: ${{ inputs.alvo }}"
            echo '```json'
            cat pacotes/importados.json 2>/dev/null || echo "import não concluído"
            echo '```'
            echo "Estados devolvidos ao de antes:"
            echo '```json'
            cat fotos/estados.json 2>/dev/null || echo "não executado"
            echo '```'
            echo "Para conferir à mão (informativo): fluxos novos que chegaram desligados, variáveis sem valor, chunks obsoletos e versões."
            echo '```json'
            node -e 'const d=require("./fotos/comparacao.json");console.log(JSON.stringify({fluxosNovosDesligados:d.fluxosNovosDesligados,variaveisSemValor:d.variaveisSemValor,chunksObsoletos:d.chunksObsoletos.length,versoes:d.versoes},null,2))' 2>/dev/null || echo "comparação não concluída"
            echo '```'
            echo "Comparação completa: artefato \`fotos-${{ inputs.alvo }}\` (comparacao.json). Perda reprova a execução."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fotos-${{ inputs.alvo }}
          path: |
            fotos/
            pacotes/importados.json
          retention-days: 90
      - name: Cifrar os backups
        # msdyn_componentjson da camada Active traz o conteúdo do componente (WebResource, clientdata do flow, configuração
        # do step) e pode ter URL assinada. Para restaurar: PACOTES_SENHA=... bash artefato-cifrado.sh decifrar backups.tar.enc <pasta>.
        if: always()
        shell: bash
        env:
          PACOTES_SENHA: ${{ secrets.PACOTES_SENHA }}
        run: |
          mkdir -p backups
          for d in camadas-active custom-apis-legado; do if [ -d "$d" ]; then cp -r "$d" backups/; fi; done
          bash packages/deploy/solucoes/artefato-cifrado.sh cifrar backups backups-cifrado/backups.tar.enc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backups-${{ inputs.alvo }}
          path: backups-cifrado/
          if-no-files-found: ignore
          retention-days: 90

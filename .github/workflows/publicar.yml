name: Publicar soluções

# Leva as 3 soluções gerenciadas do Sistema (BetinhosCore, BetinhosAutomacao, BetinhosInterface) do DEV para o
# TEST e/ou o PROD: tabelas, colunas, formulários, visões, flows, plugins, WebResources, app e sitemap. Dados não vão por solução.
# A BetinhosMotoristas é publicada só pelo repositório app-motoristas-v2.
# Caminho normal: o workflow Produção (producao.yml) chama este com alvo test-e-prod quando a main recebe mudança fora da tela.
# À mão (Actions › Run workflow) continua valendo para refazer um ensaio ou repetir um alvo.
#  - exportar (environment dev): trava do commit (a tela e os plugins do DEV têm de ser os deste commit), conferência das 4 soluções no DEV
#    (barreira), versão seguinte e export gerenciado conferido. Um export só serve TEST e PROD: o PROD recebe exatamente os
#    pacotes que o TEST ensaiou. Por solução, a impressão digital do DEV (impressao.ps1) decide antes do export: sem mudança
#    desde a última publicação em todos os alvos = pulada (sem ZIP); igual ao pacote do último Deploy = reaproveita; senão exporta.
#    Só vale com a variável SOLUCOES_IMPRESSAO=confiar; sem ela (modo observar) exporta tudo e prova a decisão no resumo;
#  - importar-test e depois importar-prod (_importar-solucoes.yml). O PROD só começa com o TEST verde, e o environment prod
#    tem revisor obrigatório (Renan). Backup do PROD feito pelo próprio job, ou rótulo informado à mão. Solução com o mesmo
#    conteúdo da última publicação no ambiente (tag solucoes-<alvo>) é pulada; importar_tudo força o import.
# Repositório público: qualquer conta do GitHub baixa artefatos. O export passa pela trava de segredos (segredos.ps1, dentro
# do exportar-do-dev.ps1) e o artefato "pacotes" sobe só cifrado (artefato-cifrado.sh, AES-256 com o secret PACOTES_SENHA
# do repositório). Sem o secret, o job falha antes do export.
on:
  workflow_dispatch:
    inputs:
      alvo:
        description: 'Ambiente de destino (test-e-prod = ensaio no TEST e, se passar, o PROD com os mesmos pacotes)'
        type: choice
        required: true
        default: test
        options: [test, test-e-prod, prod]
      solucoes:
        description: 'Soluções separadas por vírgula (vazio = as 3 do Sistema)'
        required: false
        default: ''
      backup:
        description: 'PROD: rótulo de um backup manual já feito (pac admin backup). Vazio = o job faz o backup.'
        required: false
        default: ''
      importar_tudo:
        description: 'Importar as soluções mesmo com conteúdo igual ao da última publicação no ambiente'
        type: boolean
        default: false
  workflow_call:
    inputs:
      alvo:
        type: string
        required: true
      solucoes:
        type: string
        required: false
        default: ''
      backup:
        type: string
        required: false
        default: ''
      importar_tudo:
        type: boolean
        required: false
        default: false

# A tag solucoes-<alvo> registra o que passou em cada ambiente (_importar-solucoes.yml).
permissions:
  contents: write

jobs:
  exportar:
    runs-on: windows-latest
    timeout-minutes: 60
    environment: dev
    # O mesmo grupo do deploy.yml: o DEV não muda no meio do export.
    concurrency:
      group: dataverse-dev
      cancel-in-progress: false
    env:
      DV_ENVIRONMENT_URL: ${{ vars.DV_ENVIRONMENT_URL }}
      DV_TENANT_ID: ${{ vars.DV_TENANT_ID }}
      DV_CLIENT_ID: ${{ vars.DV_CLIENT_ID }}
      DV_CLIENT_SECRET: ${{ secrets.DV_CLIENT_SECRET }}
      SOLUCOES: ${{ inputs.solucoes }}
    steps:
      - name: Alvo válido
        shell: bash
        run: |
          case "${{ inputs.alvo }}" in test|prod|test-e-prod) ;; *) echo "::error::alvo inválido: ${{ inputs.alvo }}"; exit 1 ;; esac
      - name: Secret PACOTES_SENHA
        shell: bash
        env:
          PACOTES_SENHA: ${{ secrets.PACOTES_SENHA }}
        run: |
          if [ -z "$PACOTES_SENHA" ]; then echo "::error::Secret PACOTES_SENHA ausente (repository secret). Sem ele os pacotes não podem subir cifrados; nada foi exportado."; exit 1; fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Trava do commit (tela e plugins do DEV são os deste commit)
        # O export sai do DEV, que recebe a develop. Se a develop já tem tela ou plugin novo que não está neste commit, o PROD
        # o receberia sem passar pela main. O DEV registra o commit publicado na descrição da tela (push-dev.ps1) e de cada
        # assembly Cr40f.*.Plugin e Betinhos.DriverRecordSharing (no workflow Deploy); pendentes-dev.ps1 compara com este commit.
        run: |
          $r = powershell.exe -NoProfile -ExecutionPolicy Bypass -File packages/deploy/pendentes-dev.ps1 -Ate $env:GITHUB_SHA | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'pendentes-dev.ps1 falhou.' }
          if ($r.tela -or $r.webresources -or $r.formulario -or @($r.plugins).Count) {
            $r.motivos | ForEach-Object { Write-Host $_ }
            throw "O DEV difere deste commit ($($env:GITHUB_SHA.Substring(0,7))). Espere o Deploy da develop terminar (ou rode-o com forcar_plugins), ou leve a develop inteira para a main e publique de novo."
          }
          Write-Host "DEV com a tela e os plugins de $($env:GITHUB_SHA.Substring(0,7))."
      - name: Instalar pac
        run: |
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool
          pac auth create --name ci-dev --applicationId $env:DV_CLIENT_ID --clientSecret $env:DV_CLIENT_SECRET --tenant $env:DV_TENANT_ID --environment $env:DV_ENVIRONMENT_URL
      - name: Última publicação em cada alvo
        # Tags solucoes-<alvo> (versão, hash e impressão digital de cada solução). Arquivo vazio = alvo sem registro, não pula.
        shell: bash
        run: |
          case "${{ inputs.alvo }}" in test) alvos="test" ;; prod) alvos="prod" ;; *) alvos="test prod" ;; esac
          lista=""
          for a in $alvos; do
            : > "publicadas-$a.json"
            if git fetch --quiet --no-tags origin "+refs/tags/solucoes-$a:refs/tags/solucoes-$a"; then
              git tag -l --format='%(contents)' "solucoes-$a" > "publicadas-$a.json"
            fi
            lista="${lista:+$lista,}$a=publicadas-$a.json"
          done
          echo "PUBLICADAS=$lista" >> "$GITHUB_ENV"
      # Último pacote do Deploy da develop (deploy.yml, job pacotes). A develop é a branch padrão, então o cache dela vale
      # também nas execuções da main. Só é usado se a impressão digital do DEV não mudou desde o export dele.
      - name: Pacote do último Deploy
        uses: actions/cache/restore@v4
        with:
          path: cache-cifrado
          key: solucoes-dev-cifrado-${{ github.sha }}
          restore-keys: solucoes-dev-cifrado-
      - name: Decifrar o pacote do último Deploy
        # Cache cifrado (PR de fork lê caches da branch padrão). Sem cache, ou se não decifrar, segue sem reaproveitamento.
        if: hashFiles('cache-cifrado/pacotes.tar.enc') != ''
        shell: bash
        env:
          PACOTES_SENHA: ${{ secrets.PACOTES_SENHA }}
        run: |
          if ! bash packages/deploy/solucoes/artefato-cifrado.sh decifrar cache-cifrado/pacotes.tar.enc cache-solucoes; then
            echo "::warning::Pacote do último Deploy não decifrou (PACOTES_SENHA trocado?); exporta sem reaproveitar."
            rm -rf cache-solucoes
          fi
      - name: Conferir, decidir por solução e exportar
        # SOLUCOES_IMPRESSAO (variável do repositório): vazia = modo observar (exporta tudo e só registra o que teria decidido);
        # confiar = pula a solução sem mudança e reaproveita o pacote do Deploy. importar_tudo nunca pula.
        env:
          CONFIAR: ${{ vars.SOLUCOES_IMPRESSAO == 'confiar' }}
          IMPORTAR_TUDO: ${{ inputs.importar_tudo }}
        run: |
          $extra = @('-Cache', 'cache-solucoes')
          if ($env:IMPORTAR_TUDO -ne 'true') { $extra += @('-Publicadas', $env:PUBLICADAS) }
          if ($env:CONFIAR -eq 'true') { $extra += '-Confiar' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File packages/deploy/solucoes/exportar-do-dev.ps1 -EnvironmentUrl $env:DV_ENVIRONMENT_URL -Solucoes "$env:SOLUCOES" -Pasta pacotes @extra
          if ($LASTEXITCODE -ne 0) { throw "exportar-do-dev.ps1 falhou ($LASTEXITCODE)." }
      - name: Resumo do export
        if: always()
        shell: bash
        run: |
          {
            echo "## Export das soluções (modo: ${{ vars.SOLUCOES_IMPRESSAO == 'confiar' && 'confiar' || 'observar' }})"
            echo '```json'
            cat pacotes/manifesto.json 2>/dev/null || echo "export não concluído"
            echo '```'
            echo 'origem: exportado, cache (pacote do Deploy) ou pulada (sem mudança). observacao "erro" = a impressão digital falhou; não ligue o modo confiar.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Cifrar os pacotes
        # Só depois da trava de segredos (o export falha antes daqui se achar segredo).
        shell: bash
        env:
          PACOTES_SENHA: ${{ secrets.PACOTES_SENHA }}
        run: bash packages/deploy/solucoes/artefato-cifrado.sh cifrar pacotes pacotes-cifrado/pacotes.tar.enc
      - uses: actions/upload-artifact@v4
        with:
          name: pacotes
          path: pacotes-cifrado/
          retention-days: 7

  importar-test:
    needs: exportar
    if: inputs.alvo == 'test' || inputs.alvo == 'test-e-prod'
    uses: ./.github/workflows/_importar-solucoes.yml
    with:
      alvo: test
      importar_tudo: ${{ inputs.importar_tudo }}
    secrets: inherit

  importar-prod:
    needs: [exportar, importar-test]
    # Com test-e-prod o PROD só vem depois do TEST verde; com prod (à mão) o TEST foi pulado de propósito.
    if: >-
      !cancelled() && needs.exportar.result == 'success' &&
      ((inputs.alvo == 'test-e-prod' && needs.importar-test.result == 'success') ||
       (inputs.alvo == 'prod' && needs.importar-test.result == 'skipped'))
    uses: ./.github/workflows/_importar-solucoes.yml
    with:
      alvo: prod
      backup: ${{ inputs.backup }}
      importar_tudo: ${{ inputs.importar_tudo }}
    secrets: inherit

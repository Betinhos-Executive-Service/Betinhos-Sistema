name: Publicar soluções

# Leva as 4 soluções gerenciadas (BetinhosCore, BetinhosAutomacao, BetinhosInterface, BetinhosMotoristas) do DEV para o
# TEST e/ou o PROD: tabelas, colunas, formulários, visões, flows, plugins, WebResources, app e sitemap. Dados não vão por solução.
# Caminho normal: o workflow Produção (producao.yml) chama este com alvo test-e-prod quando a main recebe mudança fora da tela.
# À mão (Actions › Run workflow) continua valendo para refazer um ensaio ou repetir um alvo.
#  - exportar (environment dev): trava do commit (a tela do DEV tem de ser a deste commit), conferência das 4 no DEV
#    (barreira), versão seguinte e export gerenciado conferido. Um export só serve TEST e PROD: o PROD recebe exatamente os
#    pacotes que o TEST ensaiou;
#  - importar-test e depois importar-prod (_importar-solucoes.yml). O PROD só começa com o TEST verde, e o environment prod
#    tem revisor obrigatório (Renan). Backup do PROD feito pelo próprio job, ou rótulo informado à mão.
on:
  workflow_dispatch:
    inputs:
      alvo:
        description: 'Ambiente de destino (test-e-prod = ensaio no TEST e, se passar, o PROD com os mesmos pacotes)'
        type: choice
        required: true
        default: test
        options: [test, test-e-prod, prod]
      solucoes:
        description: 'Soluções separadas por vírgula (vazio = as 4)'
        required: false
        default: ''
      backup:
        description: 'PROD: rótulo de um backup manual já feito (pac admin backup). Vazio = o job faz o backup.'
        required: false
        default: ''
  workflow_call:
    inputs:
      alvo:
        type: string
        required: true
      solucoes:
        type: string
        required: false
        default: ''
      backup:
        type: string
        required: false
        default: ''

jobs:
  exportar:
    runs-on: windows-latest
    timeout-minutes: 60
    environment: dev
    # O mesmo grupo do deploy.yml: o DEV não muda no meio do export.
    concurrency:
      group: dataverse-dev
      cancel-in-progress: false
    env:
      DV_ENVIRONMENT_URL: ${{ vars.DV_ENVIRONMENT_URL }}
      DV_TENANT_ID: ${{ vars.DV_TENANT_ID }}
      DV_CLIENT_ID: ${{ vars.DV_CLIENT_ID }}
      DV_CLIENT_SECRET: ${{ secrets.DV_CLIENT_SECRET }}
      SOLUCOES: ${{ inputs.solucoes }}
    steps:
      - name: Alvo válido
        shell: bash
        run: |
          case "${{ inputs.alvo }}" in test|prod|test-e-prod) ;; *) echo "::error::alvo inválido: ${{ inputs.alvo }}"; exit 1 ;; esac
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Trava do commit (a tela do DEV é a deste commit)
        # O export sai do DEV, que recebe a develop. Se a develop já tem tela nova que não está neste commit, o PROD a receberia
        # sem passar pela main. A descrição do cr40f_SistemaBetinhos.html traz o commit publicado no DEV (push-dev.ps1).
        run: |
          $base = $env:DV_ENVIRONMENT_URL.TrimEnd('/')
          $tokenBody = @{ grant_type = 'client_credentials'; client_id = $env:DV_CLIENT_ID; client_secret = $env:DV_CLIENT_SECRET; scope = "$base/.default" }
          $token = (Invoke-RestMethod -Method Post -Uri "https://login.microsoftonline.com/$env:DV_TENANT_ID/oauth2/v2.0/token" -Body $tokenBody).access_token
          $rows = @((Invoke-RestMethod -Uri "$base/api/data/v9.2/webresourceset?`$select=description&`$filter=name eq 'cr40f_SistemaBetinhos.html'" -Headers @{ Authorization = "Bearer $token"; Accept = 'application/json' }).value)
          if ($rows.Count -ne 1) { throw 'cr40f_SistemaBetinhos.html ausente ou duplicado no DEV.' }
          if ("$($rows[0].description)" -notmatch '^v\d+\.\d+\.\d+ ([0-9a-f]{40})') {
            throw "A tela do DEV não registra o commit ('$($rows[0].description)'). Rode o workflow Deploy na develop e publique de novo."
          }
          $devCommit = $Matches[1]
          git cat-file -e "$devCommit^{commit}"
          if ($LASTEXITCODE -ne 0) { throw "O commit da tela do DEV ($devCommit) não está no repositório." }
          $diferentes = @(git diff --name-only $devCommit $env:GITHUB_SHA | node packages/deploy/caminho-publicacao.mjs --front)
          if ($diferentes.Count) {
            Write-Host ($diferentes -join "`n")
            throw "A tela do DEV ($($devCommit.Substring(0,7))) difere da deste commit ($($env:GITHUB_SHA.Substring(0,7))). Espere o Deploy da develop terminar, ou leve a develop inteira para a main e publique de novo."
          }
          Write-Host "DEV com a tela de $devCommit, igual à deste commit."
      - name: Instalar pac
        run: |
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool
          pac auth create --name ci-dev --applicationId $env:DV_CLIENT_ID --clientSecret $env:DV_CLIENT_SECRET --tenant $env:DV_TENANT_ID --environment $env:DV_ENVIRONMENT_URL
      - name: Conferir, subir versão e exportar
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File packages/deploy/solucoes/exportar-do-dev.ps1 -EnvironmentUrl $env:DV_ENVIRONMENT_URL -Solucoes "$env:SOLUCOES" -Pasta pacotes
      - uses: actions/upload-artifact@v4
        with:
          name: pacotes
          path: pacotes/
          retention-days: 7

  importar-test:
    needs: exportar
    if: inputs.alvo == 'test' || inputs.alvo == 'test-e-prod'
    uses: ./.github/workflows/_importar-solucoes.yml
    with:
      alvo: test
    secrets: inherit

  importar-prod:
    needs: [exportar, importar-test]
    # Com test-e-prod o PROD só vem depois do TEST verde; com prod (à mão) o TEST foi pulado de propósito.
    if: >-
      !cancelled() && needs.exportar.result == 'success' &&
      ((inputs.alvo == 'test-e-prod' && needs.importar-test.result == 'success') ||
       (inputs.alvo == 'prod' && needs.importar-test.result == 'skipped'))
    uses: ./.github/workflows/_importar-solucoes.yml
    with:
      alvo: prod
      backup: ${{ inputs.backup }}
    secrets: inherit

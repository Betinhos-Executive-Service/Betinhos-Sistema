name: Produção

# main → PROD (decisão do Renan, 05/11/2026). A main só recebe a develop inteira (PR develop → main, merge do Renan); o merge
# automático do plantão vai até a develop. Cada push na main escolhe o caminho pelos arquivos que mudaram desde a última
# publicação (tag prod-publicado), com packages/deploy/caminho-publicacao.mjs:
#  - front: só a tela do Sistema Betinhos → direto ao PROD (push-front-prod.ps1, environment prod-front). Se der errado,
#    publicar a versão anterior resolve em minutos e nenhum dado se perde;
#  - plugin: só código de plugin (Cr40f.*.Plugin e Betinhos.DriverRecordSharing) que já existe no PROD → copia para o PROD o assembly que o DEV já usa (decisão do Renan,
#    05/11/2026: exportar-plugins-dev.ps1 com a trava do commit, depois push-plugins-prod.ps1, environment prod-front).
#    Tela e plugin juntos (front-plugin) fazem os dois no mesmo job (plugin), um logo depois do outro e só depois de o export
#    do DEV e o pnpm install terminarem: o plugin primeiro, a tela em seguida. Antes eram dois jobs e a tela chegava ao PROD
#    minutos antes do plugin que ela chama (o plugin-dev espera o Deploy da develop na fila dataverse-dev);
#  - solucoes: qualquer outra coisa (schema, flows, registrador, outros WebResources, arquivo desconhecido) → publicar.yml
#    com test-e-prod: export do DEV, ensaio no TEST e PROD com os mesmos pacotes, backup e aprovação do Renan;
#  - worker: o Worker Cloudflare acompanhar-motorista (apps/acompanhar-motorista) → `wrangler deploy` direto no Worker PROD (job
#    worker, environment prod-front, sem soluções nem Dataverse). Roda em paralelo ao caminho da tela/plugin/soluções quando o
#    mesmo push mexe nos dois; a tag só anda com todos verdes. Nunca roda wrangler kv, secret nem delete;
#  - portal: o portal do cliente (apps/portal-cliente) → Worker `portal-cliente` (wrangler deploy sem env) + Pages `portal-cliente`
#    (cliente.betinhos.com.br), job portal, environment prod-front. Como o worker, roda em paralelo e a tag só anda com ele verde.
#    Piloto: o binding API do Pages aponta para portal-cliente-dev até a variável do repositório PORTAL_API_SERVICE valer `portal-cliente`;
#  - nada: só documentação, CI, skills → só move a tag.
# A tag só anda quando a publicação passa: o que falhou ou foi recusado volta a contar no próximo push.
# Depois do marcar, em todo caminho (inclusive nada), o job acessos roda o corte dos acessos (acessos-corte.yml) no
# modo de packages/deploy/acessos/corte.json. A tag prod-publicado não espera o corte; corte travado deixa a execução
# vermelha e é reavaliado na próxima publicação.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      caminho:
        description: 'auto = pelos arquivos; front, solucoes, worker ou portal força o caminho'
        type: choice
        default: auto
        options: [auto, front, solucoes, worker, portal]

# Uma publicação de cada vez, na ordem dos merges. Só uma fica na fila (a mais nova); como o caminho é calculado desde a
# última publicação que passou, a mais nova já inclui o que a cancelada levaria.
concurrency:
  group: producao
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  caminho:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      caminho: ${{ steps.decidir.outputs.caminho }}
      plugins: ${{ steps.decidir.outputs.plugins }}
      worker: ${{ steps.decidir.outputs.worker }}
      portal: ${{ steps.decidir.outputs.portal }}
      base: ${{ steps.base.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Commit da publicação anterior (tag prod-publicado antes de andar), para o job projetos ler o intervalo publicado.
      - id: base
        run: |
          if base=$(git rev-parse -q --verify 'refs/tags/prod-publicado^{commit}') && git merge-base --is-ancestor "$base" HEAD; then
            echo "base=$base" >> "$GITHUB_OUTPUT"
          fi
      - id: decidir
        env:
          FORCADO: ${{ inputs.caminho }}
        run: |
          if [ -n "$FORCADO" ] && [ "$FORCADO" != "auto" ]; then
            resultado="{\"caminho\":\"$FORCADO\",\"motivo\":\"forçado à mão\",\"worker\":$([ "$FORCADO" = worker ] && echo true || echo false),\"portal\":$([ "$FORCADO" = portal ] && echo true || echo false)}"
          elif base=$(git rev-parse -q --verify 'refs/tags/prod-publicado^{commit}') && git merge-base --is-ancestor "$base" HEAD; then
            resultado=$(git diff --name-only "$base" HEAD | node packages/deploy/caminho-publicacao.mjs)
          else
            resultado=$(node packages/deploy/caminho-publicacao.mjs --sem-base)
          fi
          caminho=$(node -p "JSON.parse(process.argv[1]).caminho" "$resultado")
          echo "caminho=$caminho" >> "$GITHUB_OUTPUT"
          echo "worker=$(node -p "JSON.parse(process.argv[1]).worker === true" "$resultado")" >> "$GITHUB_OUTPUT"
          echo "portal=$(node -p "JSON.parse(process.argv[1]).portal === true" "$resultado")" >> "$GITHUB_OUTPUT"
          echo "plugins=$(node -p "(JSON.parse(process.argv[1]).plugins ?? []).join(',')" "$resultado")" >> "$GITHUB_OUTPUT"
          echo "## Caminho: $caminho" >> "$GITHUB_STEP_SUMMARY"
          node -p "JSON.parse(process.argv[1]).motivo" "$resultado" >> "$GITHUB_STEP_SUMMARY"

  # Só a tela. Com tela e plugin juntos (front-plugin), a tela vai no job plugin, logo depois do assembly.
  front:
    needs: caminho
    if: needs.caminho.outputs.caminho == 'front'
    runs-on: windows-latest
    timeout-minutes: 20
    # Environment sem revisor (a aprovação é o merge na main), com regra de branch: só a main.
    environment: prod-front
    concurrency:
      group: publicar-prod
      cancel-in-progress: false
    env:
      DV_ENVIRONMENT_URL: ${{ vars.DV_ENVIRONMENT_URL }}
      DV_TENANT_ID: ${{ vars.DV_TENANT_ID }}
      DV_CLIENT_ID: ${{ vars.DV_CLIENT_ID }}
      DV_CLIENT_SECRET: ${{ secrets.DV_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@betinhos-executive-service'
      - run: pnpm install --frozen-lockfile --filter @betinhos/shell...
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File packages/deploy/push-front-prod.ps1
      - name: Versão publicada
        shell: bash
        run: echo "Publicado no PROD (só a tela) - v$(node -p "require('./apps/shell/package.json').version")" >> "$GITHUB_STEP_SUMMARY"

  # Exporta do DEV no grupo do deploy.yml: espera o Deploy da develop em andamento, e a trava confere o commit.
  plugin-dev:
    needs: caminho
    if: contains(needs.caminho.outputs.caminho, 'plugin')
    runs-on: windows-latest
    timeout-minutes: 30
    environment: dev
    concurrency:
      group: dataverse-dev
      cancel-in-progress: false
    env:
      DV_ENVIRONMENT_URL: ${{ vars.DV_ENVIRONMENT_URL }}
      DV_TENANT_ID: ${{ vars.DV_TENANT_ID }}
      DV_CLIENT_ID: ${{ vars.DV_CLIENT_ID }}
      DV_CLIENT_SECRET: ${{ secrets.DV_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Trava do commit e export dos assemblies
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File packages/deploy/exportar-plugins-dev.ps1 -Plugins "${{ needs.caminho.outputs.plugins }}" -Pasta plugins-prod
      - uses: actions/upload-artifact@v4
        with:
          name: plugins-prod
          path: plugins-prod/
          retention-days: 1

  # Tudo o que é lento (export do DEV, download, pnpm install) termina antes da primeira escrita no PROD. Depois, plugin e tela
  # seguem um atrás do outro: o backend primeiro, para a tela nova nunca chamar o plugin antigo.
  plugin:
    needs: [caminho, plugin-dev]
    runs-on: windows-latest
    timeout-minutes: 30
    environment: prod-front
    concurrency:
      group: publicar-prod
      cancel-in-progress: false
    env:
      DV_ENVIRONMENT_URL: ${{ vars.DV_ENVIRONMENT_URL }}
      DV_TENANT_ID: ${{ vars.DV_TENANT_ID }}
      DV_CLIENT_ID: ${{ vars.DV_CLIENT_ID }}
      DV_CLIENT_SECRET: ${{ secrets.DV_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: plugins-prod
          path: plugins-prod
      - uses: pnpm/action-setup@v4
        if: needs.caminho.outputs.caminho == 'front-plugin'
      - uses: actions/setup-node@v4
        if: needs.caminho.outputs.caminho == 'front-plugin'
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@betinhos-executive-service'
      - if: needs.caminho.outputs.caminho == 'front-plugin'
        run: pnpm install --frozen-lockfile --filter @betinhos/shell...
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Plugins no PROD
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File packages/deploy/push-plugins-prod.ps1 -Pasta plugins-prod
      - name: Tela no PROD (logo depois dos plugins)
        if: needs.caminho.outputs.caminho == 'front-plugin'
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File packages/deploy/push-front-prod.ps1
      - name: Publicado
        shell: bash
        env:
          CAMINHO: ${{ needs.caminho.outputs.caminho }}
          PLUGINS: ${{ needs.caminho.outputs.plugins }}
        run: |
          echo "Publicado no PROD (código de plugin) - $PLUGINS. Camada Active até o próximo import das soluções." >> "$GITHUB_STEP_SUMMARY"
          if [ "$CAMINHO" = "front-plugin" ]; then
            echo "Tela publicada logo depois dos plugins - v$(node -p "require('./apps/shell/package.json').version")" >> "$GITHUB_STEP_SUMMARY"
          fi

  # Worker acompanhar-motorista no PROD (o Worker de nome acompanhar-motorista, KV e Durable Object já existentes; secrets intactos).
  # Independe do Dataverse e das soluções. Só `wrangler deploy`: nunca `wrangler kv`, `wrangler secret` nem `wrangler delete`.
  worker:
    needs: caminho
    if: needs.caminho.outputs.worker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Environment sem revisor (a aprovação é o merge na main), com regra de branch: só a main. Guarda o secret CLOUDFLARE_API_TOKEN.
    environment: prod-front
    env:
      APP: apps/acompanhar-motorista
      URL_PROD: https://acompanhar-motorista.betinhosexecutiveservice.workers.dev
    steps:
      - uses: actions/checkout@v4
      - name: Conferir o token da Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Falta o secret CLOUDFLARE_API_TOKEN no environment prod-front (template 'Edit Cloudflare Workers')."
            exit 1
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@betinhos-executive-service'
      - name: Instalar só o Worker
        run: pnpm install --frozen-lockfile --filter @betinhos/acompanhar-motorista...
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Sem commit (a main é protegida): package.json e src/version.mjs mudam só neste runner. A base é a maior entre a versão do repo
      # e a que o Worker PROD mostra no ar (sequência própria, independente da do DEV), então a versão nunca retrocede.
      - name: Versão nova
        id: versao
        run: |
          node "$APP/scripts/bump-version.mjs" --publicada "$URL_PROD"
          echo "versao=$(node -p "require('./$APP/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Build do front (Static Assets)
        run: pnpm --filter @betinhos/acompanhar-motorista build
      - name: Publicar no Cloudflare (Worker PROD)
        working-directory: apps/acompanhar-motorista
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deploy
      - name: Conferir no ar
        env:
          VERSAO: ${{ steps.versao.outputs.versao }}
        run: |
          bash "$APP/scripts/conferir-no-ar.sh" "$URL_PROD" "$VERSAO"
          echo "Publicado no PROD (Worker acompanhar-motorista) - v$VERSAO" >> "$GITHUB_STEP_SUMMARY"

  # Portal do cliente no PROD: Worker `portal-cliente` (KV, ratelimits e secrets próprios, criados à mão) e Pages `portal-cliente`
  # (cliente.betinhos.com.br). Independe do Dataverse e das soluções. Só `wrangler deploy` e `wrangler pages deploy`: nunca
  # `wrangler kv`, `wrangler secret` nem `wrangler delete`.
  # Piloto (decisão do Renan, 24/11/2026): o binding API do Pages aponta para o Worker da variável do repositório PORTAL_API_SERVICE;
  # vazia = portal-cliente-dev (Dataverse DEV). Ao ligar o PROD, a variável passa a valer `portal-cliente` (sem PR; vale no próximo deploy).
  portal:
    needs: caminho
    if: needs.caminho.outputs.portal == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: prod-front
    env:
      APP: apps/portal-cliente
      URL_PROD: https://cliente.betinhos.com.br
      PORTAL_API_SERVICE: ${{ vars.PORTAL_API_SERVICE }}
    steps:
      - uses: actions/checkout@v4
      - name: Conferir o token da Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Falta o secret CLOUDFLARE_API_TOKEN no environment prod-front (template 'Edit Cloudflare Workers', com Cloudflare Pages: Edit)."
            exit 1
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@betinhos-executive-service'
      - name: Instalar só o portal
        run: pnpm install --frozen-lockfile --filter @betinhos/portal-cliente...
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Sem commit (a main é protegida): o package.json muda só neste runner. A base é a maior entre a versão do repo e a que o PROD
      # mostra no ar (sequência própria, independente da do DEV), então a versão nunca retrocede.
      - name: Build (versão nova)
        id: versao
        run: |
          PUBLISHED_VERSION="$(node "$APP/scripts/versao-publicada.mjs" "$URL_PROD")" pnpm --filter @betinhos/portal-cliente build
          echo "versao=$(node -p "require('./$APP/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Publicar o Worker (portal-cliente)
        working-directory: apps/portal-cliente
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deploy
      - name: Publicar o Pages (portal-cliente)
        working-directory: apps/portal-cliente
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/publicar-pages.mjs --projeto portal-cliente --servico "${PORTAL_API_SERVICE:-portal-cliente-dev}"
      - name: Conferir no ar
        env:
          VERSAO: ${{ steps.versao.outputs.versao }}
        run: |
          bash "$APP/scripts/conferir-no-ar.sh" "$URL_PROD" "$VERSAO"
          echo "Publicado no PROD (portal do cliente) - v$VERSAO; API → ${PORTAL_API_SERVICE:-portal-cliente-dev}" >> "$GITHUB_STEP_SUMMARY"

  solucoes:
    needs: caminho
    if: needs.caminho.outputs.caminho == 'solucoes'
    uses: ./.github/workflows/publicar.yml
    with:
      alvo: test-e-prod
    secrets: inherit

  marcar:
    needs: [caminho, front, plugin, worker, portal, solucoes]
    # Tela e plugin juntos vão no job plugin: a tag só anda com os dois verdes (a tela é o último passo dele). O Worker, quando o push
    # o inclui (output worker), também precisa estar verde, seja qual for o caminho principal.
    if: >-
      !cancelled() && needs.caminho.result == 'success' &&
      (needs.caminho.outputs.worker != 'true' || needs.worker.result == 'success') &&
      (needs.caminho.outputs.portal != 'true' || needs.portal.result == 'success') &&
      (needs.caminho.outputs.caminho == 'nada' || needs.caminho.outputs.caminho == 'worker' || needs.caminho.outputs.caminho == 'portal' || needs.solucoes.result == 'success' ||
       (needs.caminho.outputs.caminho == 'front' && needs.front.result == 'success') ||
       ((needs.caminho.outputs.caminho == 'plugin' || needs.caminho.outputs.caminho == 'front-plugin') && needs.plugin.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Mover a tag prod-publicado
        run: |
          git tag -f prod-publicado "$GITHUB_SHA"
          git push -f origin refs/tags/prod-publicado

  # Módulo Projetos: grava "Publicado no PROD" nas etapas PRJ-n.m citadas nos commits e PRs do intervalo publicado
  # (packages/deploy/projetos/publicados.mjs). Vale para os três caminhos (tela, plugin e soluções) porque só roda depois de a
  # tag andar. Best-effort: nunca derruba nem atrasa a publicação; tabela ausente ou código não encontrado viram aviso no resumo.
  projetos:
    needs: [caminho, marcar]
    if: >-
      !cancelled() && needs.marcar.result == 'success' &&
      needs.caminho.outputs.caminho != 'nada' && needs.caminho.outputs.base != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    # Mesma conta de serviço da tela no PROD (sem revisor, só a main).
    environment: prod-front
    permissions:
      contents: read
      pull-requests: read
    env:
      DV_ENVIRONMENT_URL: ${{ vars.DV_ENVIRONMENT_URL }}
      DV_TENANT_ID: ${{ vars.DV_TENANT_ID }}
      DV_CLIENT_ID: ${{ vars.DV_CLIENT_ID }}
      DV_CLIENT_SECRET: ${{ secrets.DV_CLIENT_SECRET }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publicado no PROD nas etapas
        continue-on-error: true
        env:
          BASE: ${{ needs.caminho.outputs.base }}
        run: node packages/deploy/projetos/publicados.mjs --base "$BASE" --head "$GITHUB_SHA"

  # Corte dos acessos no PROD (plano 4). Aprovação = merge do PR develop → main que levou "prod": "cortar" ou "desfazer".
  acessos:
    needs: [caminho, marcar]
    if: ${{ !cancelled() && needs.marcar.result == 'success' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/acessos-corte.yml
    with:
      ambiente: prod
      environment: prod-front
    secrets: inherit
    permissions:
      contents: write
      actions: read

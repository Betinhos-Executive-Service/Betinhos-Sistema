packages:
  - apps/*
  - packages/*
allowBuilds:
  # core-js (opcional do jspdf) só imprime aviso de patrocínio no postinstall.
  core-js: false
  esbuild: true
  workerd: true
# Pacotes do nosso Design System entram assim que publicados (a espera vale só para terceiros).
minimumReleaseAgeExclude:
  - '@betinhos-executive-service/*'
# O App Motoristas precisa construir o mesmo HTML de antes da migração: o npm resolvia framer-motion/motion-dom 12.40.0.
overrides:
  motion@12.40.0>framer-motion: 12.40.0
  framer-motion@12.40.0>motion-dom: 12.40.0
# lucide-react 0.468 e o @betinhos ui não declaram @types/react como peer; sem isso o pnpm liga o @types/react
# içado (18 do App Motoristas ou 19 do resto) e o build quebra com ReactNode de outra versão.
packageExtensions:
  '@betinhos-executive-service/ui':
    peerDependencies:
      '@types/react': '*'
    peerDependenciesMeta:
      '@types/react':
        optional: true
  lucide-react@0.468.0:
    peerDependencies:
      '@types/react': '*'
    peerDependenciesMeta:
      '@types/react':
        optional: true

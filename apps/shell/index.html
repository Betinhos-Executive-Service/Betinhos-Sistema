<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sistema Betinhos</title>
    <!-- App instalável: o manifesto e os ícones são WebResources (pedem o cookie de sessão). -->
    <link rel="manifest" href="/WebResources/cr40f_SistemaBetinhos.webmanifest" crossorigin="use-credentials" />
    <meta name="theme-color" content="#001a3d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Betinhos" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/WebResources/cr40f_SistemaBetinhosAppleIcon.png" />
    <link rel="icon" type="image/png" href="/WebResources/cr40f_SistemaBetinhosIcon192.png" />
    <script>
      // No DEV o app instalado leva "DEV" no nome (mesmo id e escopo; só o nome muda).
      if (location.hostname === 'org23b93544.crm2.dynamics.com') {
        fetch('/WebResources/cr40f_SistemaBetinhos.webmanifest', { credentials: 'same-origin' })
          .then(function (r) { return r.json() })
          .then(function (m) {
            var abs = function (p) { return location.origin + p }
            m.name += ' DEV'
            m.short_name += ' DEV'
            m.id = abs(m.id)
            m.start_url = abs(m.start_url)
            m.scope = abs(m.scope)
            m.icons.forEach(function (i) { i.src = abs(i.src) })
            document.querySelector('link[rel=manifest]').href =
              'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(m))
            document.querySelector('meta[name=apple-mobile-web-app-title]').content = 'Betinhos DEV'
          })
          .catch(function () {})
      }
    </script>
    <style>
      /* Splash da marca (mesmo visual do BrandLoader): aparece antes do JS e some no primeiro quadro do app. */
      #boot-splash { position: fixed; inset: 0; z-index: 2147483000; display: grid; place-content: center; background: #e4e6eb; }
      #boot-splash .boot-splash__mark { position: relative; width: 92px; height: 92px; }
      #boot-splash img { position: absolute; inset: 12px; width: 68px; height: 68px; border-radius: 50%; box-shadow: 0 8px 24px rgba(0, 26, 61, 0.22); }
      #boot-splash .boot-splash__ring { position: absolute; inset: 0; border-radius: 50%;
        background: conic-gradient(from 0deg, rgba(0, 26, 61, 0) 0 30%, rgba(0, 26, 61, 0.55) 70%, #001a3d 100%), rgba(0, 26, 61, 0.1);
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3.5px));
        mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3.5px));
        animation: boot-splash-spin 0.9s linear infinite; }
      @keyframes boot-splash-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #boot-splash .boot-splash__ring { animation-duration: 2.4s; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-splash" role="status" aria-label="Carregando">
      <div class="boot-splash__mark" aria-hidden="true"><span class="boot-splash__ring"></span><img src="/src/assets/logo-betinhos-b-192.webp" alt="" /></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
